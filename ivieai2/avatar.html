<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ivie AI — Talking Avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden; /* Prevent double scroll on mobile */
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    min-height: 100vh;
    min-height: 100dvh; /* Dynamic viewport height for mobile browsers */
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    padding: 10px;
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px 18px;
    width: 100%;
    max-width: 500px;
    max-height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 1.15em;
    margin-bottom: 12px;
    color: #7ec8e3;
    line-height: 1.3;
  }

  /* ===== Avatar ===== */
  .avatar-stage {
    position: relative;
    width: 150px;
    height: 180px;
    margin: 0 auto 22px;
    flex-shrink: 0;
  }
  #avatar { position: absolute; inset: 0; transition: transform 0.1s; }

  .head {
    position: absolute;
    top: 14px; left: 50%; transform: translateX(-50%);
    width: 90px; height: 112px;
    background: #f2c9a0;
    border-radius: 50% 50% 45% 45%;
    box-shadow: inset -8px -8px 16px rgba(0,0,0,0.1);
  }
  .hair {
    position: absolute;
    top: 5px; left: 50%; transform: translateX(-50%);
    width: 100px; height: 62px;
    background: #2b1b12;
    border-radius: 50px 50px 14px 14px;
  }
  .eye {
    position: absolute; top: 48px;
    width: 11px; height: 11px;
    background: #2b1b12;
    border-radius: 50%;
    animation: blink 4s infinite;
  }
  .eye.left  { left: 26px; }
  .eye.right { right: 26px; }
  @keyframes blink { 0%,92%,100% { height:11px; } 95% { height:2px; } }

  .mouth {
    position: absolute;
    bottom: 22px; left: 50%; transform: translateX(-50%);
    width: 28px; height: 6px;
    background: #b3554e;
    border-radius: 0 0 30px 30px;
    transition: height 0.08s ease;
  }
  #avatar.talking .mouth { animation: talk 0.25s infinite alternate; }
  @keyframes talk {
    from { height: 4px;  width: 24px; }
    to   { height: 16px; width: 32px; }
  }
  #avatar.talking { animation: headbob 0.6s infinite alternate ease-in-out; }
  @keyframes headbob {
    from { transform: rotate(-2deg) translateY(0); }
    to   { transform: rotate(2deg)  translateY(-3px); }
  }
  .body {
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 130px; height: 58px;
    background: #4a6fa5;
    border-radius: 44px 44px 0 0;
  }
  .status {
    position: absolute; bottom: -22px; left: 0; right: 0;
    font-size: 0.75em; color: #7ec8e3; min-height: 1.2em;
  }

  /* ===== Connection badge ===== */
  .conn-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.7em;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.3);
    transition: all 0.3s;
    align-self: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conn-badge.ok   { background: rgba(76,175,80,0.25);  color: #a5d6a7; }
  .conn-badge.bad  { background: rgba(244,67,54,0.25);  color: #ef9a9a; }
  .conn-badge.wait { background: rgba(255,193,7,0.25);  color: #ffe082; }

  /* ===== Chat area ===== */
  .chat-log {
    position: relative;
    height: 140px;
    min-height: 110px;
    overflow-y: auto;
    overflow-x: hidden;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 12px;
    text-align: left;
    font-size: 0.82em;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    position: static;
    margin-bottom: 8px;
    line-height: 1.4;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user   { color: #a8d8ea; }
  .msg.bot    { color: #ffd9a0; }
  .msg .who   { font-weight: bold; font-size: 0.8em; opacity: 0.7; }

  .input-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: none; border-radius: 10px;
    background: rgba(255,255,255,0.12);
    color: #fff; font-size: 1em; outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }

  button {
    padding: 12px 18px;
    border: none; border-radius: 10px;
    background: #7ec8e3; color: #16213e;
    font-weight: bold; cursor: pointer;
    transition: background 0.2s;
    font-size: 0.95em;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  button:hover { background: #a8d8ea; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== Action buttons ===== */
  .action-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: nowrap;
  }
  .action-bar button {
    flex: 1;
    padding: 10px 6px;
    font-size: 0.72em;
    font-weight: 600;
    background: rgba(255,255,255,0.1);
    color: #7ec8e3;
    border: 1px solid rgba(126,200,227,0.3);
    border-radius: 8px;
    transition: background 0.2s, border-color 0.2s;
    min-width: 0;
  }
  .action-bar button:hover {
    background: rgba(126,200,227,0.2);
    border-color: #7ec8e3;
  }
  .action-bar button.primary {
    background: #7ec8e3; color: #16213e;
    border-color: #7ec8e3;
  }
  .action-bar button.primary:hover { background: #a8d8ea; }

  .settings { margin-top: 10px; font-size: 0.8em; text-align: left; }
  .settings label { display: block; margin-bottom: 6px; opacity: 0.7; }
  .settings input {
    width: 100%; margin-top: 4px; padding: 8px;
    background: rgba(0,0,0,0.3); border: none;
    border-radius: 6px; color: #7ec8e3; font-size: 0.9em;
  }
  .hidden-url { display: none; }

  /* ===== Responsive tweaks for very small screens ===== */
  @media (max-width: 380px) {
    .container { padding: 16px 12px; border-radius: 14px; }
    h1 { font-size: 1em; margin-bottom: 10px; }
    .avatar-stage { width: 130px; height: 156px; margin-bottom: 18px; }
    .head { width: 78px; height: 96px; top: 12px; }
    .hair { width: 88px; height: 54px; }
    .eye { width: 9px; height: 9px; top: 42px; }
    .eye.left { left: 22px; }
    .eye.right { right: 22px; }
    .mouth { width: 24px; height: 5px; bottom: 18px; }
    .body { width: 112px; height: 50px; }
    .status { font-size: 0.7em; bottom: -20px; }
    .chat-log { height: 120px; font-size: 0.78em; }
    .action-bar button { font-size: 0.65em; padding: 9px 4px; }
    button { padding: 11px 14px; font-size: 0.88em; }
    input[type="text"] { padding: 11px 12px; font-size: 0.95em; }
  }

  /* ===== Landscape phones ===== */
  @media (max-height: 600px) and (orientation: landscape) {
    .container {
      max-width: 700px;
      padding: 16px 20px;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }
    h1 { width: 100%; font-size: 1em; margin-bottom: 8px; }
    .conn-badge { width: 100%; margin-bottom: 8px; }
    .avatar-stage { width: 120px; height: 144px; margin: 0 16px 0 0; }
    .chat-log { flex: 1; min-width: 200px; height: 120px; margin-bottom: 8px; }
    .action-bar { width: 100%; margin-bottom: 6px; }
    .input-row { width: 100%; }
    .head { width: 72px; height: 88px; top: 11px; }
    .hair { width: 82px; height: 50px; }
    .eye { width: 9px; height: 9px; top: 38px; }
    .eye.left { left: 20px; }
    .eye.right { right: 20px; }
    .mouth { width: 22px; height: 5px; bottom: 16px; }
    .body { width: 104px; height: 46px; }
    .status { font-size: 0.68em; bottom: -18px; }
    .action-bar button { font-size: 0.7em; padding: 8px 6px; }
  }

  /* ===== Reduce motion for accessibility ===== */
  @media (prefers-reduced-motion: reduce) {
    #avatar.talking,
    #avatar.talking .mouth,
    .eye {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🗣️ Ivie AI — Talking Avatar</h1>

  <div class="conn-badge wait" id="connBadge">⏳ Checking connection...</div>

  <div class="avatar-stage">
    <div class="avatar" id="avatar">
      <div class="hair"></div>
      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>
      <div class="body"></div>
    </div>
    <div class="status" id="status">Ready to chat</div>
  </div>

  <div class="chat-log" id="chatLog"></div>

  <!-- Export & New Session buttons -->
  <div class="action-bar">
    <button id="exportJsonBtn" title="Export chat as JSON">📥 JSON</button>
    <button id="exportTxtBtn" title="Export chat as plain text">📄 TXT</button>
    <button id="newSessionBtn" class="primary" title="Start a new session">✨ New Session</button>
  </div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

  <!-- Hidden endpoint field — no visible URL reference -->
  <div class="settings hidden-url">
    <input type="text" id="endpoint" value="https://GeorgeUwaifo-IvieAI.hf.space">
  </div>
</div>

<script>
// ============ CONFIGURATION (not displayed to user) ============
const SPACE_URL = "https://GeorgeUwaifo-IvieAI.hf.space";
// ==============================================================

const avatar    = document.getElementById('avatar');
const statusEl  = document.getElementById('status');
const chatLog   = document.getElementById('chatLog');
const input     = document.getElementById('userInput');
const sendBtn   = document.getElementById('sendBtn');
const endpoint  = document.getElementById('endpoint');
const connBadge = document.getElementById('connBadge');

/* ---------- Conversation store ---------- */
let conversation = [];   // array of { role: 'user'|'bot', text: string }

/* ---------- Health check (no URL shown) ---------- */
async function checkHealth() {
  const base = endpoint.value.trim().replace(/\/+$/, '');
  connBadge.className = 'conn-badge wait';
  connBadge.textContent = '⏳ Checking connection...';
  try {
    const res = await fetch(`${base}/health`, { method: 'GET' });
    if (res.ok) {
      connBadge.className = 'conn-badge ok';
      connBadge.textContent = '✅ Connected to Ivie AI';
    } else {
      connBadge.className = 'conn-badge bad';
      connBadge.textContent = `⚠️ Service responded with HTTP ${res.status}`;
    }
  } catch (err) {
    connBadge.className = 'conn-badge bad';
    connBadge.textContent = '❌ Could not reach Ivie AI service';
  }
}
checkHealth();

/* ---------- Chat UI ---------- */
function addMsg(who, text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = `<span class="who">${who}:</span><br>${escapeHtml(text)}`;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;

  // Store in conversation
  conversation.push({ role: cls === 'user' ? 'user' : 'bot', text: text });
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- Extract reply ---------- */
function extractReply(data) {
  if (typeof data === 'string') return data;
  if (Array.isArray(data)) return extractReply(data[0]);
  if (data && typeof data === 'object') {
    for (const key of ['response','reply','answer','output','text','message']) {
      if (key in data) return extractReply(data[key]);
    }
    for (const v of Object.values(data)) {
      if (typeof v === 'string' && v.trim()) return v;
    }
  }
  return JSON.stringify(data);
}

/* ---------- Talk to Ivie AI (/chat) ---------- */
async function queryModel(message) {
  const base = endpoint.value.trim().replace(/\/+$/, '');
  if (!base) throw new Error('Service unavailable.');
  const res = await fetch(`${base}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message })
  });
  if (!res.ok) throw new Error(`Service error (HTTP ${res.status})`);
  const contentType = res.headers.get('content-type') || '';
  const data = contentType.includes('json') ? await res.json() : await res.text();
  const reply = extractReply(data);
  if (!reply || !reply.trim()) throw new Error('Empty response from Ivie AI');
  return reply.trim();
}

/* ---------- Speech ---------- */
function speak(text, onEnd) {
  if (!('speechSynthesis' in window)) { onEnd && onEnd(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1; u.pitch = 1.05;
  u.onstart = () => avatar.classList.add('talking');
  u.onend   = () => { avatar.classList.remove('talking'); onEnd && onEnd(); };
  u.onerror = () => { avatar.classList.remove('talking'); onEnd && onEnd(); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ---------- Send flow ---------- */
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('You', text, 'user');
  statusEl.textContent = 'Contacting Ivie AI... 🤔';

  let reply;
  try {
    reply = await queryModel(text);
  } catch (err) {
    reply = '⚠️ ' + err.message;
  }

  addMsg('Ivie', reply, 'bot');
  statusEl.textContent = 'Speaking... 🗣️';
  speak(reply, () => {
    statusEl.textContent = 'Ready to chat';
    sendBtn.disabled = false;
    input.focus();
  });
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

/* ---------- EXPORT FUNCTIONS ---------- */

function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function getTimestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
}

document.getElementById('exportJsonBtn').addEventListener('click', () => {
  if (conversation.length === 0) {
    statusEl.textContent = 'Nothing to export — start chatting!';
    setTimeout(() => statusEl.textContent = 'Ready to chat', 2000);
    return;
  }
  const exportData = {
    exportedAt: new Date().toISOString(),
    messageCount: conversation.length,
    messages: conversation
  };
  downloadFile(
    JSON.stringify(exportData, null, 2),
    `ivie_chat_${getTimestamp()}.json`,
    'application/json'
  );
});

document.getElementById('exportTxtBtn').addEventListener('click', () => {
  if (conversation.length === 0) {
    statusEl.textContent = 'Nothing to export — start chatting!';
    setTimeout(() => statusEl.textContent = 'Ready to chat', 2000);
    return;
  }
  let txt = `Ivie AI Chat Export — ${new Date().toLocaleString()}\n`;
  txt += `========================================\n\n`;
  for (const msg of conversation) {
    const label = msg.role === 'user' ? 'You' : 'Ivie';
    txt += `[${label}]\n${msg.text}\n\n`;
  }
  downloadFile(txt, `ivie_chat_${getTimestamp()}.txt`, 'text/plain');
});

/* ---------- NEW SESSION ---------- */

document.getElementById('newSessionBtn').addEventListener('click', () => {
  // Stop any ongoing speech
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  avatar.classList.remove('talking');

  // Clear conversation store and UI
  conversation = [];
  chatLog.innerHTML = '';
  input.value = '';
  sendBtn.disabled = false;

  statusEl.textContent = 'New session started ✨';
  setTimeout(() => { statusEl.textContent = 'Ready to chat'; }, 1800);

  // Re-check connection
  checkHealth();

  input.focus();
});
</script>
</body>
</html>
