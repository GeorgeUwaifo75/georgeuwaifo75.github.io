<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ivie AI — Talking Avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e2a4a 0%, #0f0f1e 70%);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    padding: 10px;
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px 18px;
    width: 100%;
    max-width: 500px;
    max-height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 1.15em;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #7ec8e3, #a8d8ea, #7ec8e3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  /* ===== Avatar stage ===== */
  .avatar-stage {
    position: relative;
    width: 200px;
    height: 240px;
    margin: 0 auto 22px;
    flex-shrink: 0;
    filter: drop-shadow(0 10px 30px rgba(126,200,227,0.15));
  }
  #avatar {
    position: absolute;
    inset: 0;
    transition: transform 0.15s;
    transform-origin: 50% 90%;
  }

  #avatarSvg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .avatar-stage::before {
    content: '';
    position: absolute;
    top: 20%; left: 50%;
    transform: translateX(-50%);
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(126,200,227,0.15) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== Blink — fixed: scale each eye from its own center ===== */
  .eye-group {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.09s ease-in-out;
  }
  .eye-group.blink {
    transform: scaleY(0.08);
  }

  /* Talking head bob */
  #avatar.talking {
    animation: headbob 1.1s infinite alternate ease-in-out;
  }
  @keyframes headbob {
    0%   { transform: rotate(-1.2deg) translateY(0); }
    50%  { transform: rotate(0deg)   translateY(-2px); }
    100% { transform: rotate(1.2deg) translateY(-3px); }
  }

  /* Idle breathing */
  #avatar:not(.talking) {
    animation: breathe 4s infinite ease-in-out;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-2px) scale(1.005); }
  }

  .status {
    position: absolute;
    bottom: -24px; left: 0; right: 0;
    font-size: 0.75em;
    color: #7ec8e3;
    min-height: 1.2em;
    letter-spacing: 0.02em;
    z-index: 2;
  }

  /* ===== Connection badge ===== */
  .conn-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.7em;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.3);
    transition: all 0.3s;
    align-self: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conn-badge.ok   { background: rgba(76,175,80,0.25);  color: #a5d6a7; }
  .conn-badge.bad  { background: rgba(244,67,54,0.25);  color: #ef9a9a; }
  .conn-badge.wait { background: rgba(255,193,7,0.25);  color: #ffe082; }

  /* ===== Chat area ===== */
  .chat-log {
    position: relative;
    height: 140px;
    min-height: 110px;
    overflow-y: auto;
    overflow-x: hidden;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 12px;
    text-align: left;
    font-size: 0.82em;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    margin-bottom: 8px;
    line-height: 1.4;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user   { color: #a8d8ea; }
  .msg.bot    { color: #ffd9a0; }
  .msg .who   { font-weight: bold; font-size: 0.8em; opacity: 0.7; }

  .input-row { display: flex; gap: 6px; margin-bottom: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    padding: 12px 14px;
    border: none; border-radius: 10px;
    background: rgba(255,255,255,0.12);
    color: #fff; font-size: 1em; outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }

  button {
    padding: 12px 18px;
    border: none; border-radius: 10px;
    background: #7ec8e3; color: #16213e;
    font-weight: bold; cursor: pointer;
    transition: background 0.2s;
    font-size: 0.95em;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  button:hover { background: #a8d8ea; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== Action buttons ===== */
  .action-bar {
    display: flex; gap: 6px;
    margin-bottom: 10px;
    flex-wrap: nowrap;
  }
  .action-bar button {
    flex: 1;
    padding: 10px 6px;
    font-size: 0.72em;
    font-weight: 600;
    background: rgba(255,255,255,0.1);
    color: #7ec8e3;
    border: 1px solid rgba(126,200,227,0.3);
    border-radius: 8px;
    transition: background 0.2s, border-color 0.2s;
    min-width: 0;
  }
  .action-bar button:hover {
    background: rgba(126,200,227,0.2);
    border-color: #7ec8e3;
  }
  .action-bar button.primary {
    background: #7ec8e3; color: #16213e;
    border-color: #7ec8e3;
  }
  .action-bar button.primary:hover { background: #a8d8ea; }

  .settings { margin-top: 10px; font-size: 0.8em; text-align: left; }
  .settings label { display: block; margin-bottom: 6px; opacity: 0.7; }
  .settings input {
    width: 100%; margin-top: 4px; padding: 8px;
    background: rgba(0,0,0,0.3); border: none;
    border-radius: 6px; color: #7ec8e3; font-size: 0.9em;
  }
  .hidden-url { display: none; }

  /* ===== Responsive tweaks ===== */
  @media (max-width: 380px) {
    .container { padding: 16px 12px; border-radius: 14px; }
    h1 { font-size: 1em; margin-bottom: 10px; }
    .avatar-stage { width: 170px; height: 204px; margin-bottom: 18px; }
    .status { font-size: 0.7em; bottom: -20px; }
    .chat-log { height: 120px; font-size: 0.78em; }
    .action-bar button { font-size: 0.65em; padding: 9px 4px; }
    button { padding: 11px 14px; font-size: 0.88em; }
    input[type="text"] { padding: 11px 12px; font-size: 0.95em; }
  }

  @media (max-height: 600px) and (orientation: landscape) {
    .container {
      max-width: 700px;
      padding: 16px 20px;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }
    h1 { width: 100%; font-size: 1em; margin-bottom: 8px; }
    .conn-badge { width: 100%; margin-bottom: 8px; }
    .avatar-stage { width: 150px; height: 180px; margin: 0 16px 0 0; }
    .chat-log { flex: 1; min-width: 200px; height: 120px; margin-bottom: 8px; }
    .action-bar { width: 100%; margin-bottom: 6px; }
    .input-row { width: 100%; }
    .status { font-size: 0.68em; bottom: -18px; }
    .action-bar button { font-size: 0.7em; padding: 8px 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #avatar, #avatar.talking, #avatar:not(.talking) {
      animation: none !important;
    }
    .eye-group { transition: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🗣️ Ivie AI — Talking Avatar</h1>

  <div class="avatar-stage">

        <ellipse cx="142" cy="118" rx="3" ry="6" fill="#c99368" opacity="0.6"/>

        <!-- Face -->
        <path d="M 62 78 Q 58 100 60 120 Q 62 145 80 158 Q 100 165 120 158
                 Q 138 145 140 120 Q 142 100 138 78 Q 130 55 100 52 Q 70 55 62 78 Z"

        <!-- Hair -->
        <path d="M 55 70 Q 52 40 75 28 Q 100 18 125 28 Q 148 40 145 70 L 148 95

              fill="url(#hairGrad)" opacity="0.95"/>
        <path d="M 70 40 Q 90 25 120 32 Q 140 42 143 65 Q 130 50 100 48 Q 75 50 65 68 Q 62 55 70 40 Z"
              fill="url(#hairHighlight)"/>
        <path d="M 62 72 Q 70 58 88 55 Q 100 53 112 55 Q 130 58 138 72 Q 130 62 100 60 Q 70 62 62 72 Z"
              fill="#1a0f08" opacity="0.55"/>

        <!-- Eyebrows -->
        <path d="M 70 92 Q 80 87 92 90" stroke="#2b1b12" stroke-width="2.2"

        <!--

          so scaleY() collapses toward the eye's own vertical center.

        <g id="mouthGroup">

<script>
// ============ CONFIGURATION ============
const SPACE_URL = "https://GeorgeUwaifo-IvieAI.hf.space";

const FEMALE_VOICE_HINTS = [
  'Samantha', 'Victoria', 'Karen', 'Moira', 'Tessa', 'Fiona',
  'Google UK English Female', 'Google US English',
  'Microsoft Zira', 'Microsoft Aria', 'Microsoft Jenny',
  'Microsoft Michelle', 'Microsoft Amber',
  'Female', 'Woman', 'Zira', 'Aria', 'Jenny', 'Serena',
  'Eva', 'Catherine', 'Susan', 'Allison', 'Ava', 'Nicky'
];
// =======================================

const avatar       = document.getElementById('avatar');
const statusEl     = document.getElementById('status');
const chatLog      = document.getElementById('chatLog');
const input        = document.getElementById('userInput');
const sendBtn      = document.getElementById('sendBtn');
const endpoint     = document.getElementById('endpoint');
const connBadge    = document.getElementById('connBadge');
const leftEye      = document.getElementById('leftEye');
const rightEye     = document.getElementById('rightEye');
const mouthCavity  = document.getElementById('mouthCavity');
const lowerLip     = document.getElementById('lowerLip');
const lipHighlight = document.getElementById('lipHighlight');

/* ---------- Natural random blink (fixed) ----------
   Note: .eye-group has `transform-box: fill-box; transform-origin: center;`
   so scaleY collapses toward each eye's own center — not the SVG top-left.
----------------------------------------------------- */
(function blinkLoop() {
  const delay = 2200 + Math.random() * 3500;
  setTimeout(() => {
    leftEye.classList.add('blink');
    rightEye.classList.add('blink');
    setTimeout(() => {
      leftEye.classList.remove('blink');
      rightEye.classList.remove('blink');
    }, 130);
    blinkLoop();
  }, delay);
})();

/* ---------- Conversation store ---------- */
let conversation = [];

/* ---------- Health check ---------- */
async function checkHealth() {
  const base = endpoint.value.trim().replace(/\/+$/, '');
  connBadge.className = 'conn-badge wait';
  connBadge.textContent = '⏳ Checking connection...';
  try {
    const res = await fetch(`${base}/health`, { method: 'GET' });
    if (res.ok) {
      connBadge.className = 'conn-badge ok';
      connBadge.textContent = '✅ Connected to Ivie AI';
    } else {
      connBadge.className = 'conn-badge bad';
      connBadge.textContent = `⚠️ Service responded with HTTP ${res.status}`;
    }
  } catch (err) {
    connBadge.className = 'conn-badge bad';
    connBadge.textContent = '❌ Could not reach Ivie AI service';
  }
}
checkHealth();

/* ---------- Chat UI ---------- */
function addMsg(who, text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = `<span class="who">${who}:</span><br>${escapeHtml(text)}`;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  conversation.push({ role: cls === 'user' ? 'user' : 'bot', text: text });
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- Extract reply ---------- */
function extractReply(data) {
  if (typeof data === 'string') return data;
  if (Array.isArray(data)) return extractReply(data[0]);
  if (data && typeof data === 'object') {
    for (const key of ['response','reply','answer','output','text','message']) {
      if (key in data) return extractReply(data[key]);
    }
    for (const v of Object.values(data)) {
      if (typeof v === 'string' && v.trim()) return v;
    }
  }
  return JSON.stringify(data);
}

/* ---------- Query model ---------- */
async function queryModel(message) {
  const base = endpoint.value.trim().replace(/\/+$/, '');
  if (!base) throw new Error('Service unavailable.');
  const res = await fetch(`${base}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message })
  });
  if (!res.ok) throw new Error(`Service error (HTTP ${res.status})`);
  const contentType = res.headers.get('content-type') || '';
  const data = contentType.includes('json') ? await res.json() : await res.text();
  const reply = extractReply(data);
  if (!reply || !reply.trim()) throw new Error('Empty response from Ivie AI');
  return reply.trim();
}

/* =========================================================
   FEMALE VOICE SELECTION
   ========================================================= */
let cachedFemaleVoice = null;

function pickFemaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;

  for (const hint of FEMALE_VOICE_HINTS) {
    const v = voices.find(v => v.name.toLowerCase().includes(hint.toLowerCase()));
    if (v) return v;
  }
  const nameMatch = voices.find(v =>
    /female|woman|zira|aria|jenny|serena|samantha|victoria|karen|moira|tessa|fiona|susan|allison|ava|eva/i
      .test(v.name)
  );
  if (nameMatch) return nameMatch;

  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || voices[0];
}

function refreshFemaleVoice() {
  cachedFemaleVoice = pickFemaleVoice();
}

if ('speechSynthesis' in window) {
  refreshFemaleVoice();
  speechSynthesis.onvoiceschanged = refreshFemaleVoice;
}

/* =========================================================
   NATURAL MOUTH ANIMATION
   ========================================================= */
let mouthAnimations = [];

function stopMouthAnimation() {
  mouthAnimations.forEach(a => { try { a.cancel(); } catch(e){} });
  mouthAnimations = [];
  lowerLip.setAttribute('d', 'M 88 145 Q 100 148 112 145 Q 108 148 100 149 Q 92 148 88 145 Z');
  mouthCavity.setAttribute('ry', '2');
  mouthCavity.setAttribute('rx', '12');
  lipHighlight.setAttribute('d', 'M 93 147 Q 100 148.5 107 147');
}

function startMouthAnimation() {
  stopMouthAnimation();

  const lipPath = (open) => {
    const midY   = 148 + open * 6;
    const width  = 12 + open * 4;
    return `M ${100 - width} ${145 + open * 1.2}
            Q 100 ${midY} ${100 + width} ${145 + open * 1.2}
            Q ${100 + width - 2} ${midY - 0.5} 100 ${midY - 0.5}
            Q ${100 - width + 2} ${midY - 0.5} ${100 - width} ${145 + open * 1.2} Z`;
  };

  const cavityRx = (open) => 12 + open * 4;
  const cavityRy = (open) => 2  + open * 8;
  const cavityCy = (open) => 146 + open * 2;

  const buildSequence = () => {
    const seq = [];
    const frames = 8 + Math.floor(Math.random() * 6);
    for (let i = 0; i < frames; i++) {
      const r = Math.random();
      let open;
      if (r < 0.25)      open = 0.05 + Math.random() * 0.15;
      else if (r < 0.70) open = 0.25 + Math.random() * 0.30;
      else if (r < 0.92) open = 0.55 + Math.random() * 0.25;
      else               open = 0.85 + Math.random() * 0.15;
      seq.push(open);
    }
    seq.push(0.05);
    return seq;
  };

  const animateOneCycle = () => {
    const seq = buildSequence();
    const totalDuration = 900 + Math.random() * 700;

    const lipKeyframes = seq.map(open => ({ d: lipPath(open) }));
    const cavKeyframes = seq.map(open => ({
      rx: cavityRx(open),
      ry: cavityRy(open),
      cy: cavityCy(open)
    }));
    const hiKeyframes = seq.map(open => ({
      d: `M ${93 - open * 1.5} ${147 + open * 1.5}
          Q 100 ${148.5 + open * 2} ${107 + open * 1.5} ${147 + open * 1.5}`
    }));

    const lipAnim = lowerLip.animate(lipKeyframes, {
      duration: totalDuration,
      easing: 'ease-in-out',
      fill: 'forwards'
    });
    const cavAnim = mouthCavity.animate(cavKeyframes, {
      duration: totalDuration,
      easing: 'ease-in-out',
      fill: 'forwards'
    });
    const hiAnim = lipHighlight.animate(hiKeyframes, {
      duration: totalDuration,
      easing: 'ease-in-out',
      fill: 'forwards'
    });

    mouthAnimations.push(lipAnim, cavAnim, hiAnim);

    lipAnim.onfinish = () => {
      if (avatar.classList.contains('talking')) {
        animateOneCycle();
      }
    };
  };

  animateOneCycle();
}

/* ---------- SPEECH ---------- */
function speak(text, onEnd) {
  if (!('speechSynthesis' in window)) {
    onEnd && onEnd();
    return;
  }

  const u = new SpeechSynthesisUtterance(text);
  u.rate   = 1.0;
  u.pitch  = 1.25;
  u.volume = 1.0;

  if (!cachedFemaleVoice) refreshFemaleVoice();
  if (cachedFemaleVoice) {
    u.voice = cachedFemaleVoice;
    u.lang  = cachedFemaleVoice.lang || 'en-US';
  } else {
    u.lang = 'en-US';
  }

  u.onstart = () => {
    avatar.classList.add('talking');
    startMouthAnimation();
  };

  const finish = () => {
    avatar.classList.remove('talking');
    stopMouthAnimation();
    onEnd && onEnd();
  };

  u.onend   = finish;
  u.onerror = finish;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ---------- Send ---------- */
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('You', text, 'user');
  statusEl.textContent = 'Contacting Ivie AI... 🤔';

  let reply;
  try {
    reply = await queryModel(text);
  } catch (err) {
    reply = '⚠️ ' + err.message;
  }

  addMsg('Ivie', reply, 'bot');
  statusEl.textContent = 'Speaking... 🗣️';
  speak(reply, () => {
    statusEl.textContent = 'Ready to chat';
    sendBtn.disabled = false;
    input.focus();
  });
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

/* ---------- Export ---------- */
function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function getTimestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
}

document.getElementById('exportJsonBtn').addEventListener('click', () => {
  if (conversation.length === 0) {
    statusEl.textContent = 'Nothing to export — start chatting!';
    setTimeout(() => statusEl.textContent = 'Ready to chat', 2000);
    return;
  }
  const exportData = {
    exportedAt: new Date().toISOString(),
    messageCount: conversation.length,
    messages: conversation
  };
  downloadFile(JSON.stringify(exportData, null, 2),
    `ivie_chat_${getTimestamp()}.json`, 'application/json');
});

document.getElementById('exportTxtBtn').addEventListener('click', () => {
  if (conversation.length === 0) {
    statusEl.textContent = 'Nothing to export — start chatting!';
    setTimeout(() => statusEl.textContent = 'Ready to chat', 2000);
    return;
  }
  let txt = `Ivie AI Chat Export — ${new Date().toLocaleString()}\n`;
  txt += `========================================\n\n`;
  for (const msg of conversation) {
    const label = msg.role === 'user' ? 'You' : 'Ivie';
    txt += `[${label}]\n${msg.text}\n\n`;
  }
  downloadFile(txt, `ivie_chat_${getTimestamp()}.txt`, 'text/plain');
});

/* ---------- New Session ---------- */
document.getElementById('newSessionBtn').addEventListener('click', () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  avatar.classList.remove('talking');
  stopMouthAnimation();
  conversation = [];
  chatLog.innerHTML = '';
  input.value = '';
  sendBtn.disabled = false;
  statusEl.textContent = 'New session started ✨';
  setTimeout(() => { statusEl.textContent = 'Ready to chat'; }, 1800);
  checkHealth();
  input.focus();
});
</script>
