<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ivie AI — Talking Avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e2a4a 0%, #0f0f1e 70%);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    padding: 10px;
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px 18px;
    width: 100%;
    max-width: 500px;
    max-height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 1.15em;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #7ec8e3, #a8d8ea, #7ec8e3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  .avatar-stage {
    position: relative;
    width: 200px;
    height: 240px;
    margin: 0 auto 22px;
    flex-shrink: 0;
    filter: drop-shadow(0 10px 30px rgba(126,200,227,0.15));
  }
  #avatar {
    position: absolute;
    inset: 0;
    transition: transform 0.15s;
    transform-origin: 50% 90%;
  }

  #avatarSvg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .avatar-stage::before {
    content: '';
    position: absolute;
    top: 20%; left: 50%;
    transform: translateX(-50%);
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(126,200,227,0.15) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  .eye-group {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.09s ease-in-out;
  }
  .eye-group.blink {
    transform: scaleY(0.08);
  }

  #avatar.talking {
    animation: headbob 1.1s infinite alternate ease-in-out;
  }
  @keyframes headbob {
    0%   { transform: rotate(-1.2deg) translateY(0); }
    50%  { transform: rotate(0deg)   translateY(-2px); }
    100% { transform: rotate(1.2deg) translateY(-3px); }
  }

  #avatar:not(.talking) {
    animation: breathe 4s infinite ease-in-out;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-2px) scale(1.005); }
  }

  .status {
    position: absolute;
    bottom: -24px; left: 0; right: 0;
    font-size: 0.75em;
    color: #7ec8e3;
    min-height: 1.2em;
    letter-spacing: 0.02em;
    z-index: 2;
  }

  .conn-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.7em;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.3);
    transition: all 0.3s;
    align-self: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conn-badge.ok   { background: rgba(76,175,80,0.25);  color: #a5d6a7; }
  .conn-badge.bad  { background: rgba(244,67,54,0.25);  color: #ef9a9a; }
  .conn-badge.wait { background: rgba(255,193,7,0.25);  color: #ffe082; }

  .chat-log {
    position: relative;
    height: 140px;
    min-height: 110px;
    overflow-y: auto;
    overflow-x: hidden;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 12px;
    text-align: left;
    font-size: 0.82em;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    margin-bottom: 8px;
    line-height: 1.4;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.user   { color: #a8d8ea; }
  .msg.bot    { color: #ffd9a0; }
  .msg .who   { font-weight: bold; font-size: 0.8em; opacity: 0.7; }

  .input-row { display: flex; gap: 6px; margin-bottom: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    padding: 12px 14px;
    border: none; border-radius: 10px;
    background: rgba(255,255,255,0.12);
    color: #fff; font-size: 1em; outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }

  button {
    padding: 12px 18px;
    border: none; border-radius: 10px;
    background: #7ec8e3; color: #16213e;
    font-weight: bold; cursor: pointer;
    transition: background 0.2s;
    font-size: 0.95em;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  button:hover { background: #a8d8ea; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .action-bar {
    display: flex; gap: 6px;
    margin-bottom: 10px;
    flex-wrap: nowrap;
  }
  .action-bar button {
    flex: 1;
    padding: 10px 6px;
    font-size: 0.72em;
    font-weight: 600;
    background: rgba(255,255,255,0.1);
    color: #7ec8e3;
    border: 1px solid rgba(126,200,227,0.3);
    border-radius: 8px;
    transition: background 0.2s, border-color 0.2s;
    min-width: 0;
  }
  .action-bar button:hover {
    background: rgba(126,200,227,0.2);
    border-color: #7ec8e3;
  }
  .action-bar button.primary {
    background: #7ec8e3; color: #16213e;
    border-color: #7ec8e3;
  }
  .action-bar button.primary:hover { background: #a8d8ea; }

  .settings { margin-top: 10px; font-size: 0.8em; text-align: left; }
  .settings label { display: block; margin-bottom: 6px; opacity: 0.7; }
  .settings input {
    width: 100%; margin-top: 4px; padding: 8px;
    background: rgba(0,0,0,0.3); border: none;
    border-radius: 6px; color: #7ec8e3; font-size: 0.9em;
  }
  .hidden-url { display: none; }

  @media (max-width: 380px) {
    .container { padding: 16px 12px; border-radius: 14px; }
    h1 { font-size: 1em; margin-bottom: 10px; }
    .avatar-stage { width: 170px; height: 204px; margin-bottom: 18px; }
    .status { font-size: 0.7em; bottom: -20px; }
    .chat-log { height: 120px; font-size: 0.78em; }
    .action-bar button { font-size: 0.65em; padding: 9px 4px; }
    button { padding: 11px 14px; font-size: 0.88em; }
    input[type="text"] { padding: 11px 12px; font-size: 0.95em; }
  }

  @media (max-height: 600px) and (orientation: landscape) {
    .container {
      max-width: 700px;
      padding: 16px 20px;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }
    h1 { width: 100%; font-size: 1em; margin-bottom: 8px; }
    .conn-badge { width: 100%; margin-bottom: 8px; }
    .avatar-stage { width: 150px; height: 180px; margin: 0 16px 0 0; }
    .chat-log { flex: 1; min-width: 200px; height: 120px; margin-bottom: 8px; }
    .action-bar { width: 100%; margin-bottom: 6px; }
    .input-row { width: 100%; }
    .status { font-size: 0.68em; bottom: -18px; }
    .action-bar button { font-size: 0.7em; padding: 8px 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #avatar, #avatar.talking, #avatar:not(.talking) {
      animation: none !important;
    }
    .eye-group { transition: none !important; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🗣️ Ivie AI — Talking Avatar</h1>

  <div class="conn-badge wait" id="connBadge">⏳ Checking connection...</div>

  <div class="avatar-stage">
    <div class="avatar" id="avatar">

        </defs>

        <!-- Body -->
        <path d="M 30 240 Q 30 195 65 182 L 135 182 Q 170 195 170 240 Z"

        <path d="M 82 182 Q 100 195 118 182 L 122 190 Q 100 203 78 190 Z"
              fill="#4a6fa5" opacity="0.85"/>
        <path d="M 78 182 Q 100 194 122 182 L 120 187 Q 100 198 80 187 Z"
              fill="#2c4468" opacity="0.5"/>

        <!-- Neck -->
        <path d="M 82 155 L 82 185 Q 100 192 118 185 L 118 155 Z"

        <ellipse cx="100" cy="158" rx="22" ry="7" fill="#a8714a" opacity="0.55"/>

        <!-- Ears -->
        <ellipse cx="58" cy="118" rx="6.5" ry="12" fill="#eab894" stroke="#c99368" stroke-width="0.6"/>
        <ellipse cx="142" cy="118" rx="6.5" ry="12" fill="#eab894" stroke="#c99368" stroke-width="0.6"/>
        <ellipse cx="58" cy="118" rx="3" ry="6" fill="#c99368" opacity="0.6"/>
        <ellipse cx="142" cy="118" rx="3" ry="6" fill="#c99368" opacity="0.6"/>

        <!-- Face -->
        <path d="M 62 78 Q 58 100 60 120 Q 62 145 80 158 Q 100 165 120 158
                 Q 138 145 140 120 Q 142 100 138 78 Q 130 55 100 52 Q 70 55 62 78 Z"

        <ellipse cx="74" cy="128" rx="10" ry="6" fill="url(#blush)"/>

        <!-- Hair -->
        <path d="M 55 70 Q 52 40 75 28 Q 100 18 125 28 Q 148 40 145 70 L 148 95
                 Q 145 78 138 72 Q 130 55 100 52 Q 70 55 62 72 Q 55 78 52 95 Z"

        <path d="M 55 70 Q 48 85 52 105 Q 55 118 60 120 Q 58 100 62 78 Z"

        <path d="M 145 70 Q 152 85 148 105 Q 145 118 140 120 Q 142 100 138 78 Z"
              fill="url(#hairGrad)" opacity="0.95"/>
        <path d="M 70 40 Q 90 25 120 32 Q 140 42 143 65 Q 130 50 100 48 Q 75 50 65 68 Q 62 55 70 40 Z"
              fill="url(#hairHighlight)"/>
        <path d="M 62 72 Q 70 58 88 55 Q 100 53 112 55 Q 130 58 138 72 Q 130 62 100 60 Q 70 62 62 72 Z"
              fill="#1a0f08" opacity="0.55"/>

        <!-- Eyebrows -->
        <path d="M 70 92 Q 80 87 92 90" stroke="#2b1b12" stroke-width="2.2"
              stroke-linecap="round" fill="none" opacity="0.9"/>
        <path d="M 108 90 Q 120 87 130 92" stroke="#2b1b12" stroke-width="2.2"

        <!-- Left eye -->
        <g class="eye-group" id="leftEye">
          <ellipse cx="80" cy="108" rx="10" ry="7" fill="#d8a67c" opacity="0.5"/>

        <g class="eye-group" id="rightEye">
          <ellipse cx="120" cy="108" rx="10" ry="7" fill="#d8a67c" opacity="0.5"/>

  <div class="chat-log" id="chatLog"></div>

<script>
// ============ CONFIGURATION ============
const SPACE_URL = "https://GeorgeUwaifo-IvieAI.hf.space";

const FEMALE_VOICE_HINTS = [
  'Samantha', 'Victoria', 'Karen', 'Moira', 'Tessa', 'Fiona',
  'Google UK English Female', 'Google US English',
  'Microsoft Zira', 'Microsoft Aria', 'Microsoft Jenny',
  'Microsoft Michelle', 'Microsoft Amber',
  'Female', 'Woman', 'Zira', 'Aria', 'Jenny', 'Serena',
  'Eva', 'Catherine', 'Susan', 'Allison', 'Ava', 'Nicky'
];
// =======================================

const avatar       = document.getElementById('avatar');
const statusEl     = document.getElementById('status');
const chatLog      = document.getElementById('chatLog');
const input        = document.getElementById('userInput');
const sendBtn      = document.getElementById('sendBtn');
const endpoint     = document.getElementById('endpoint');
const connBadge    = document.getElementById('connBadge');
const leftEye      = document.getElementById('leftEye');
const rightEye     = document.getElementById('rightEye');
// Rename DOM references so they never collide with function locals
const domMouthCavity  = document.getElementById('mouthCavity');
const domLowerLip     = document.getElementById('lowerLip');
const domUpperLip     = document.getElementById('upperLip');
const domLipHighlight = document.getElementById('lipHighlight');

/* ---------- Natural random blink ---------- */
(function blinkLoop() {
  const delay = 2200 + Math.random() * 3500;
  setTimeout(() => {
    leftEye.classList.add('blink');
    rightEye.classList.add('blink');
    setTimeout(() => {
      leftEye.classList.remove('blink');
      rightEye.classList.remove('blink');
    }, 130);
    blinkLoop();
  }, delay);
})();

/* ---------- Conversation store ---------- */
let conversation = [];

/* ---------- Health check ---------- */
async function checkHealth() {
  const base = endpoint.value.trim().replace(/\/+$/, '');
  connBadge.className = 'conn-badge wait';
  connBadge.textContent = '⏳ Checking connection...';
  try {
    const res = await fetch(`${base}/health`, { method: 'GET' });
    if (res.ok) {
      connBadge.className = 'conn-badge ok';
      connBadge.textContent = '✅ Connected to Ivie AI';
    } else {
      connBadge.className = 'conn-badge bad';
      connBadge.textContent = `⚠️ Service responded with HTTP ${res.status}`;
    }
  } catch (err) {
    connBadge.className = 'conn-badge bad';
    connBadge.textContent = '❌ Could not reach Ivie AI service';
  }
}
checkHealth();

/* ---------- Chat UI ---------- */
function addMsg(who, text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = `<span class="who">${who}:</span><br>${escapeHtml(text)}`;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  conversation.push({ role: cls === 'user' ? 'user' : 'bot', text: text });
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- Extract reply ---------- */
function extractReply(data) {
  if (typeof data === 'string') return data;
  if (Array.isArray(data)) return extractReply(data[0]);
  if (data && typeof data === 'object') {
    for (const key of ['response','reply','answer','output','text','message']) {
      if (key in data) return extractReply(data[key]);
    }
    for (const v of Object.values(data)) {
      if (typeof v === 'string' && v.trim()) return v;
    }
  }
  return JSON.stringify(data);
}

/* ---------- Query model ---------- */
async function queryModel(message) {
  const base = endpoint.value.trim().replace(/\/+$/, '');
  if (!base) throw new Error('Service unavailable.');
  const res = await fetch(`${base}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message })
  });
  if (!res.ok) throw new Error(`Service error (HTTP ${res.status})`);
  const contentType = res.headers.get('content-type') || '';
  const data = contentType.includes('json') ? await res.json() : await res.text();
  const reply = extractReply(data);
  if (!reply || !reply.trim()) throw new Error('Empty response from Ivie AI');
  return reply.trim();
}

/* =========================================================
   FEMALE VOICE SELECTION
   ========================================================= */
let cachedFemaleVoice = null;

function pickFemaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;

  for (const hint of FEMALE_VOICE_HINTS) {
    const v = voices.find(v => v.name.toLowerCase().includes(hint.toLowerCase()));
    if (v) return v;
  }
  const nameMatch = voices.find(v =>
    /female|woman|zira|aria|jenny|serena|samantha|victoria|karen|moira|tessa|fiona|susan|allison|ava|eva/i
      .test(v.name)
  );
  if (nameMatch) return nameMatch;

  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || voices[0];
}

function refreshFemaleVoice() {
  cachedFemaleVoice = pickFemaleVoice();
}

if ('speechSynthesis' in window) {
  refreshFemaleVoice();
  speechSynthesis.onvoiceschanged = refreshFemaleVoice;
}

/* =========================================================
   PHONEME-AWARE LIP SYNC
   ========================================================= */

const VISEMES = {
  AA: { open: 0.85, width: 1.05, round: 0.05 },
  AE: { open: 0.55, width: 1.15, round: 0.05 },
  AH: { open: 0.45, width: 1.00, round: 0.00 },
  AO: { open: 0.70, width: 0.90, round: 0.45 },
  AW: { open: 0.65, width: 0.90, round: 0.35 },
  AY: { open: 0.55, width: 1.15, round: 0.00 },
  EH: { open: 0.40, width: 1.10, round: 0.00 },
  ER: { open: 0.35, width: 0.95, round: 0.20 },
  EY: { open: 0.45, width: 1.10, round: 0.00 },
  IH: { open: 0.28, width: 1.08, round: 0.00 },
  IY: { open: 0.20, width: 1.15, round: 0.00 },
  OH: { open: 0.65, width: 0.85, round: 0.55 },
  OW: { open: 0.55, width: 0.85, round: 0.55 },
  OY: { open: 0.55, width: 0.88, round: 0.40 },
  UH: { open: 0.30, width: 0.95, round: 0.20 },
  UW: { open: 0.28, width: 0.80, round: 0.65 },
  M:  { open: 0.02, width: 0.95, round: 0.00 },
  B:  { open: 0.05, width: 0.95, round: 0.00 },
  P:  { open: 0.05, width: 0.95, round: 0.00 },
  F:  { open: 0.15, width: 1.00, round: 0.00 },
  V:  { open: 0.18, width: 1.00, round: 0.00 },
  TH: { open: 0.18, width: 0.95, round: 0.00 },
  DH: { open: 0.18, width: 0.95, round: 0.00 },
  S:  { open: 0.15, width: 1.10, round: 0.00 },
  Z:  { open: 0.15, width: 1.10, round: 0.00 },
  SH: { open: 0.25, width: 0.80, round: 0.55 },
  CH: { open: 0.20, width: 0.85, round: 0.40 },
  JH: { open: 0.22, width: 0.85, round: 0.40 },
  T:  { open: 0.15, width: 1.05, round: 0.00 },
  D:  { open: 0.18, width: 1.05, round: 0.00 },
  N:  { open: 0.15, width: 1.00, round: 0.00 },
  L:  { open: 0.30, width: 1.05, round: 0.00 },
  R:  { open: 0.35, width: 0.90, round: 0.30 },
  W:  { open: 0.20, width: 0.80, round: 0.60 },
  Y:  { open: 0.22, width: 1.10, round: 0.00 },
  K:  { open: 0.20, width: 1.05, round: 0.00 },
  G:  { open: 0.22, width: 1.05, round: 0.00 },
  HH: { open: 0.35, width: 1.00, round: 0.00 },
  REST: { open: 0.00, width: 1.00, round: 0.00 }
};

function textToVisemes(text) {
  const clean = text.toLowerCase().replace(/[^a-z\s.,!?;:'"-]/g, '');
  const words = clean.split(/(\s+|[.,!?;:])/).filter(w => w.length > 0);
  const visemes = [];

  for (const token of words) {
    if (/^[.,!?;:]+$/.test(token)) {
      visemes.push({ viseme: 'REST', duration: 220 + Math.random() * 80 });
      continue;
    }
    if (/^\s+$/.test(token)) {
      visemes.push({ viseme: 'REST', duration: 110 + Math.random() * 50 });
      continue;
    }

    const w = token;
    let i = 0;
    while (i < w.length) {
      const c  = w[i];
      const c2 = w.substr(i, 2);
      let visemeKey = null;
      let advance = 1;

      if (c2 === 'th') { visemeKey = 'TH'; advance = 2; }
      else if (c2 === 'sh') { visemeKey = 'SH'; advance = 2; }
      else if (c2 === 'ch') { visemeKey = 'CH'; advance = 2; }
      else if (c2 === 'ph') { visemeKey = 'F';  advance = 2; }
      else if (c2 === 'wh') { visemeKey = 'W';  advance = 2; }
      else if (c2 === 'ck') { visemeKey = 'K';  advance = 2; }
      else if (c2 === 'ng') { visemeKey = 'N';  advance = 2; }
      else if (c2 === 'oo') { visemeKey = 'UW'; advance = 2; }
      else if (c2 === 'ee') { visemeKey = 'IY'; advance = 2; }
      else if (c2 === 'ea') { visemeKey = 'IY'; advance = 2; }
      else if (c2 === 'ai') { visemeKey = 'EY'; advance = 2; }
      else if (c2 === 'ay') { visemeKey = 'EY'; advance = 2; }
      else if (c2 === 'ou') { visemeKey = 'AW'; advance = 2; }
      else if (c2 === 'ow') { visemeKey = 'OW'; advance = 2; }
      else if (c2 === 'oi') { visemeKey = 'OY'; advance = 2; }
      else if (c2 === 'oy') { visemeKey = 'OY'; advance = 2; }
      else if (c2 === 'au') { visemeKey = 'AO'; advance = 2; }
      else if (c2 === 'aw') { visemeKey = 'AO'; advance = 2; }
      else if (c2 === 'er') { visemeKey = 'ER'; advance = 2; }
      else if (c2 === 'ir') { visemeKey = 'ER'; advance = 2; }
      else if (c2 === 'ur') { visemeKey = 'ER'; advance = 2; }

      if (!visemeKey) {
        switch (c) {
          case 'a': visemeKey = 'AE'; break;
          case 'e': visemeKey = 'EH'; break;
          case 'i': visemeKey = 'IH'; break;
          case 'o': visemeKey = 'OH'; break;
          case 'u': visemeKey = 'AH'; break;
          case 'y': visemeKey = 'Y';  break;
          case 'm': visemeKey = 'M';  break;
          case 'b': visemeKey = 'B';  break;
          case 'p': visemeKey = 'P';  break;
          case 'f': visemeKey = 'F';  break;
          case 'v': visemeKey = 'V';  break;
          case 's': visemeKey = 'S';  break;
          case 'z': visemeKey = 'Z';  break;
          case 't': visemeKey = 'T';  break;
          case 'd': visemeKey = 'D';  break;
          case 'n': visemeKey = 'N';  break;
          case 'l': visemeKey = 'L';  break;
          case 'r': visemeKey = 'R';  break;
          case 'w': visemeKey = 'W';  break;
          case 'k': visemeKey = 'K';  break;
          case 'g': visemeKey = 'G';  break;
          case 'h': visemeKey = 'HH'; break;
          case 'c': visemeKey = 'K';  break;
          case 'j': visemeKey = 'JH'; break;
          case 'x': visemeKey = 'K';  break;
          case 'q': visemeKey = 'K';  break;
          default:  visemeKey = 'AH';
        }
      }

      const isVowel = /^(AA|AE|AH|AO|AW|AY|EH|ER|EY|IH|IY|OH|OW|OY|UH|UW)$/.test(visemeKey);
      const isStop  = /^(M|B|P)$/.test(visemeKey);
      let dur;
      if (isStop)       dur = 60 + Math.random() * 25;
      else if (isVowel) dur = 110 + Math.random() * 60;
      else              dur = 80 + Math.random() * 40;

      visemes.push({ viseme: visemeKey, duration: dur });
      i += advance;
    }

    visemes.push({ viseme: 'REST', duration: 65 + Math.random() * 40 });
  }

  return visemes;
}

/* =========================================================
   MOUTH RENDERER (FIXED — no name shadowing)
   ========================================================= */

let mouthRAF = null;

function buildMouthPaths(shape, progress) {
  const open  = Math.max(0, Math.min(1, shape.open)) * progress;
  const width = shape.width || 1.0;
  const round = shape.round || 0;

  const upperY = 143 - open * 1.2;

  const lowerTop    = 145 + open * 1.5;
  const lowerBottom = 148 + open * 7.5;

  const halfWidth = (13 * width) - (round * 2.5);

  const upperLipPath =
    `M ${100 - halfWidth} ${upperY}
     Q ${100 - halfWidth * 0.55} ${upperY - 1.6} 100 ${upperY + 0.4}
     Q ${100 + halfWidth * 0.55} ${upperY - 1.6} ${100 + halfWidth} ${upperY}
     Q ${100 + halfWidth * 0.55} ${upperY + 2.2} 100 ${upperY + 2.8}
     Q ${100 - halfWidth * 0.55} ${upperY + 2.2} ${100 - halfWidth} ${upperY} Z`;

  const lowerLipPath =
    `M ${100 - halfWidth} ${lowerTop}
     Q 100 ${lowerBottom} ${100 + halfWidth} ${lowerTop}
     Q ${100 + halfWidth - 1.5} ${lowerTop + 1.2} 100 ${lowerTop + 2.2}
     Q ${100 - halfWidth + 1.5} ${lowerTop + 1.2} ${100 - halfWidth} ${lowerTop} Z`;

  const cavityRx = halfWidth * 0.85;
  const cavityRy = open * 8.5 + 0.6;
  const cavityCy = 146 + open * 2;

  const highlightPath =
    `M ${100 - halfWidth * 0.5} ${lowerTop + 0.8}
     Q 100 ${lowerTop + 1.8} ${100 + halfWidth * 0.5} ${lowerTop + 0.8}`;

  return {
    upper: upperLipPath,
    lower: lowerLipPath,
    highlight: highlightPath,
    cavityRx, cavityRy, cavityCy
  };
}

function renderMouth(shape, progress) {
  const p = buildMouthPaths(shape, progress);
  domUpperLip.setAttribute('d', p.upper);
  domLowerLip.setAttribute('d', p.lower);
  domLipHighlight.setAttribute('d', p.highlight);
  domMouthCavity.setAttribute('rx', p.cavityRx.toFixed(2));
  domMouthCavity.setAttribute('ry', p.cavityRy.toFixed(2));
  domMouthCavity.setAttribute('cy', p.cavityCy.toFixed(2));
}

/* =========================================================
   PLAY VISEME SEQUENCE (FIXED — reliable RAF loop)
   ========================================================= */

function stopMouthAnimation() {
  if (mouthRAF) {
    cancelAnimationFrame(mouthRAF);
    mouthRAF = null;
  }
  renderMouth({ open: 0, width: 1, round: 0 }, 1);
}

function startMouthAnimation(text) {
  stopMouthAnimation();

  const visemes = textToVisemes(text);
  if (visemes.length === 0) return;

  // Build a per-frame timeline of mouth shapes
  const fps = 40;
  const frameDur = 1000 / fps;
  const timeline = [];

  for (let i = 0; i < visemes.length; i++) {
    const v = visemes[i];
    const shape = VISEMES[v.viseme] || VISEMES.REST;
    const nextV = visemes[i + 1];
    const nextShape = nextV ? (VISEMES[nextV.viseme] || VISEMES.REST) : VISEMES.REST;

    const frames = Math.max(1, Math.round(v.duration / frameDur));
    for (let f = 0; f < frames; f++) {
      const p = f / frames;
      const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      timeline.push({
        open:  shape.open  + (nextShape.open  - shape.open)  * ease,
        width: shape.width + (nextShape.width - shape.width) * ease,
        round: shape.round + (nextShape.round - shape.round) * ease
      });
    }
  }

  const totalFrames = timeline.length;
  let frameIndex = 0;
  let lastTime = performance.now();
  let accumulated = 0;

  function loop(now) {
    if (!avatar.classList.contains('talking')) {
      mouthRAF = null;
      return;
    }

    const dt = now - lastTime;
    lastTime = now;
    accumulated += dt;

    // Advance as many frames as fit in the elapsed time (with catch-up)
    while (accumulated >= frameDur) {
      accumulated -= frameDur;
      frameIndex++;
      if (frameIndex >= totalFrames) {
        // Loop the sequence if speech is still ongoing
        frameIndex = 0;
      }
    }

    renderMouth(timeline[frameIndex], 1);
    mouthRAF = requestAnimationFrame(loop);
  }

  // Show first frame immediately so there's no lag at the start
  renderMouth(timeline[0], 1);
  lastTime = performance.now();
  mouthRAF = requestAnimationFrame(loop);
}

/* ---------- SPEECH ---------- */
function speak(text, onEnd) {
  if (!('speechSynthesis' in window)) {
    onEnd && onEnd();
    return;
  }

  const u = new SpeechSynthesisUtterance(text);
  u.rate   = 1.0;
  u.pitch  = 1.25;
  u.volume = 1.0;

  if (!cachedFemaleVoice) refreshFemaleVoice();
  if (cachedFemaleVoice) {
    u.voice = cachedFemaleVoice;
    u.lang  = cachedFemaleVoice.lang || 'en-US';
  } else {
    u.lang = 'en-US';
  }

  u.onstart = () => {
    avatar.classList.add('talking');
    startMouthAnimation(text);
  };

  const finish = () => {
    avatar.classList.remove('talking');
    stopMouthAnimation();
    onEnd && onEnd();
  };

  u.onend   = finish;
  u.onerror = finish;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ---------- Send ---------- */
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('You', text, 'user');
  statusEl.textContent = 'Contacting Ivie AI... 🤔';

  let reply;
  try {
    reply = await queryModel(text);
  } catch (err) {
    reply = '⚠️ ' + err.message;
  }

  addMsg('Ivie', reply, 'bot');
  statusEl.textContent = 'Speaking... 🗣️';
  speak(reply, () => {
    statusEl.textContent = 'Ready to chat';
    sendBtn.disabled = false;
    input.focus();
  });
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

/* ---------- Export ---------- */
function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function getTimestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
}

document.getElementById('exportJsonBtn').addEventListener('click', () => {
  if (conversation.length === 0) {
    statusEl.textContent = 'Nothing to export — start chatting!';
    setTimeout(() => statusEl.textContent = 'Ready to chat', 2000);
    return;
  }
  const exportData = {
    exportedAt: new Date().toISOString(),
    messageCount: conversation.length,
    messages: conversation
  };
  downloadFile(JSON.stringify(exportData, null, 2),
    `ivie_chat_${getTimestamp()}.json`, 'application/json');
});

document.getElementById('exportTxtBtn').addEventListener('click', () => {
  if (conversation.length === 0) {
    statusEl.textContent = 'Nothing to export — start chatting!';
    setTimeout(() => statusEl.textContent = 'Ready to chat', 2000);
    return;
  }
  let txt = `Ivie AI Chat Export — ${new Date().toLocaleString()}\n`;
  txt += `========================================\n\n`;
  for (const msg of conversation) {
    const label = msg.role === 'user' ? 'You' : 'Ivie';
    txt += `[${label}]\n${msg.text}\n\n`;
  }
  downloadFile(txt, `ivie_chat_${getTimestamp()}.txt`, 'text/plain');
});

/* ---------- New Session ---------- */
document.getElementById('newSessionBtn').addEventListener('click', () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  avatar.classList.remove('talking');
  stopMouthAnimation();
  conversation = [];
  chatLog.innerHTML = '';
  input.value = '';
  sendBtn.disabled = false;
  statusEl.textContent = 'New session started ✨';
  setTimeout(() => { statusEl.textContent = 'Ready to chat'; }, 1800);
  checkHealth();
  input.focus();
});
