<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivie AI — Talking Avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px;
    width: 90%; max-width: 500px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 { font-size: 1.4em; margin-bottom: 20px; color: #7ec8e3; }

  /* ===== Avatar ===== */
  .avatar-stage {
    position: relative;
    width: 220px; height: 260px;
    margin: 0 auto 25px;
  }
  .avatar { position: absolute; inset: 0; transition: transform 0.1s; }
  .head {
    position: absolute;
    top: 20px; left: 50%; transform: translateX(-50%);
    width: 130px; height: 160px;
    background: #f2c9a0;
    border-radius: 50% 50% 45% 45%;
    box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1);
  }
  .hair {
    position: absolute;
    top: 8px; left: 50%; transform: translateX(-50%);
    width: 145px; height: 90px;
    background: #2b1b12;
    border-radius: 70px 70px 20px 20px;
  }
  .eye {
    position: absolute; top: 70px;
    width: 16px; height: 16px;
    background: #2b1b12;
    border-radius: 50%;
    animation: blink 4s infinite;
  }
  .eye.left  { left: 38px; }
  .eye.right { right: 38px; }
  @keyframes blink { 0%,92%,100% { height:16px; } 95% { height:2px; } }

  .mouth {
    position: absolute;
    bottom: 30px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 8px;
    background: #b3554e;
    border-radius: 0 0 40px 40px;
    transition: height 0.08s ease;
  }
  .avatar.talking .mouth { animation: talk 0.25s infinite alternate; }
  @keyframes talk {
    from { height: 6px;  width: 34px; }
    to   { height: 22px; width: 44px; }
  }
  .avatar.talking { animation: headbob 0.6s infinite alternate ease-in-out; }
  @keyframes headbob {
    from { transform: rotate(-2deg) translateY(0); }
    to   { transform: rotate(2deg)  translateY(-4px); }
  }
  .body {
    position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 180px; height: 80px;
    background: #4a6fa5;
    border-radius: 60px 60px 0 0;
  }
  .status {
    position: absolute; bottom: -28px; left: 0; right: 0;
    font-size: 0.85em; color: #7ec8e3; min-height: 1.2em;
  }

  /* ===== Connection badge ===== */
  .conn-badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 20px;
    font.78em;
    margin-bottom: 15px;
    background: rgba(0,0,0,0.3);
    transition: all 0.3s;
  }
  .conn-badge.ok   { background: rgba(76,175,80,0.25);  color: #a5d6a7; }
  .conn-badge.bad  { background: rgba(244,67,54,0.25);  color: #ef9a9a; }
  .conn-badge.wait { background: rgba(255,193,7,0.25);  color: #ffe082; }

  /* ===== Chat area ===== */
  .chat-log {
    height: 160px; overflow-y: auto;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 12px; margin-bottom: 15px;
    text-align: left; font-size: 0.9em;
  }
  .msg { margin-bottom: 10px; line-height: 1.4; }
  .msg.user   { color: #a8d8ea; }
  .msg.avatar { color: #ffd9a0; }
  .msg .who { font-weight: bold; font-size: 0.8em; opacity: 0.7; }

  .input-row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1; padding: 12px 15px;
    border: none; border-radius: 10px;
    background: rgba(255,255,255,0.12);
    color: #fff; font-size: 1em; outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }
  button {
    padding: 12px 22px;
    border: none; border-radius: 10px;
    background: #7ec8e3; color: #16213e;
    font-weight: bold; cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #a8d8ea; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .settings { margin-top: 15px; font-size: 0.8em; text-align: left; }
  .settings input {
    width: 100%; margin-top: 4px; padding: 8px;
    background: rgba(0,0,0,0.3); border: none;
    border-radius: 6px; color: #7ec8e3; font-size: 0.9em;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🗣️ Ivie AI — Talking Avatar</h1>

  <div class="conn-badge wait" id="connBadge">⏳ Checking connection to Ivie AI Space...</div>

  <div class="avatar-stage">
    <div class="avatar" id="avatar">
      <div class="hair"></div>
      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>
      <div class="body"></div>
    </div>
    <div class="status" id="status">Ready to chat</div>
  </div>

  <div class="chat-log" id="chatLog"></div>

  <div class="input-row">
    <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>

  <div class="settings">
    <label>🔌 Ivie AI Space URL:</label>
    <input type="text" id="endpoint" value="https://GeorgeUwaifo-IvieAI.hf.space">
  </div>
</div>

<script>
// ============ CONFIGURATION ============
const SPACE_URL      = "https://GeorgeUwaifo-IvieAI.hf.space";
const CHAT_ENDPOINT  = `${SPACE_URL}/chat`;    // POST — send message, get reply
const HEALTH_ENDPOINT = `${SPACE_URL}/health`;  // GET  — connection check
// =======================================

const avatar    = document.getElementById('avatar');
const statusEl  = document.getElementById('status');
const chatLog   = document.getElementById('chatLog');
const input     = document.getElementById('userInput');
const sendBtn   = document.getElementById('sendBtn');
const endpoint  = document.getElementById('endpoint');
const connBadge = document.getElementById('connBadge');
endpoint.value = SPACE_URL;

/* ---------- Health check on load ---------- */
async function checkHealth() {
  const base = endpoint.value.trim().replace(/\/+$/, '');
  const healthUrl = `${base}/health`;
  connBadge.className = 'conn-badge wait';
  connBadge.textContent = '⏳ Checking connection to Ivie AI Space...';
  try {
    const res = await fetch(healthUrl, { method: 'GET' });
    if (res.ok) {
      let info = '';
      try {
        const data = await res.json();
        // Show a short summary of the health payload if available
        info = data && typeof data === 'object' ? ` (${JSON.stringify(data).slice(0, 60)})` : '';
      } catch (_) { /* health may return plain text — that's fine */ }
      connBadge.className = 'conn-badge ok';
      connBadge.textContent = `✅ Connected to Ivie AI Space${info}`;
    } else {
      connBadge.className = 'conn-badge bad';
      connBadge.textContent = `⚠️ Space responded with HTTP ${res.status}`;
    }
  } catch (err) {
    connBadge.className = 'conn-badge bad';
    connBadge.textContent = '❌ Could not reach Ivie AI Space (is it running?)';
  }
}

// Re-check health whenever the URL is edited
endpoint.addEventListener('change', checkHealth);
checkHealth();

/* ---------- Chat UI ---------- */
function addMsg(who, text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = `<span class="who">who:</span><br>{who}:</span><br>who:</span><br>{escapeHtml(text)}`;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- Extract reply from various response formats ---------- */
function extractReply(data) {
  if (typeof data === 'string') return data;
  if (Array.isArray(data)) return extractReply(data[0]);
  if (data && typeof data === 'object') {
    for (const key of ['response','reply','answer','output','text','message']) {
      if (key in data) return extractReply(data[key]);
    }
    for (const v of Object.values(data)) {
      if (typeof v === 'string' && v.trim()) return v;
    }
  }
  return JSON.stringify(data);
}

/* ---------- Talk to the Ivie AI Space (/chat) ---------- */
async function queryModel(message) {
  const base = endpoint.value.trim().replace(/\/+$/, '');
  if (!base) throw new Error('Please set your Space URL first.');
  const chatUrl = `${base}/chat`;

  const res = await fetch(chatUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message })   // adjust if your /chat expects a different key
  });
  if (!res.ok) throw new Error(`HTTP res.statusfrom{res.status} fromres.statusfrom{chatUrl}`);

  const contentType = res.headers.get('content-type') || '';
  const data = contentType.includes('json')
    ? await res.json()
    : await res.text();               // handle plain-text replies too

  const reply = extractReply(data);
  if (!reply || !reply.trim()) throw new Error('Received an empty response from Ivie AI');
  return reply.trim();
}

/* ---------- Speech ---------- */
function speak(text, onEnd) {
  if (!('speechSynthesis' in window)) { onEnd && onEnd(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1; u.pitch = 1.05;
  u.onstart = () => avatar.classList.add('talking');
  u.onend   = () => { avatar.classList.remove('talking'); onEnd && onEnd(); };
  u.onerror = () => { avatar.classList.remove('talking'); onEnd && onEnd(); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ---------- Send flow ---------- */
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('You', text, 'user');
  statusEl.textContent = 'Contacting Ivie AI... 🤔';

  let reply;
  try {
    reply = await queryModel(text);
  } catch (err) {
    reply = '⚠️ ' + err.message;
  }

  addMsg('Ivie', reply, 'avatar');
  statusEl.textContent = 'Speaking... 🗣️';
  speak(reply, () => {
    statusEl.textContent = 'Ready to chat';
    sendBtn

    statusEl.textContent = 'Ready to chat';
    sendBtn.disabled = false;
    input.focus();
  });
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
