<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ivie AI — Talking Avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1e2a4a 0%, #0f0f1e 70%);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    padding: 10px;
    -webkit-tap-highlight-color: transparent;
  }

  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 20px 18px;
    width: 100%;
    max-width: 500px;
    max-height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 1.15em;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #7ec8e3, #a8d8ea, #7ec8e3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  .avatar-stage {
    position: relative;
    width: 200px;
    height: 240px;
    margin: 0 auto 22px;
    flex-shrink: 0;
    filter: drop-shadow(0 10px 30px rgba(126,200,227,0.15));
  }

  .avatar-bob {
    position: absolute;
    inset: 0;
    transform-origin: 50% 90%;
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transform: translateZ(0);
  }
  .avatar-bob.talking {
    animation: headbob 1.1s infinite alternate ease-in-out;
  }
  .avatar-bob:not(.talking) {
    animation: breathe 4s infinite ease-in-out;
  }
  @keyframes headbob {
    0%   { transform: rotate(-1.2deg) translateY(0); }
    50%  { transform: rotate(0deg)   translateY(-2px); }
    100% { transform: rotate(1.2deg) translateY(-3px); }
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-2px) scale(1.005); }
  }

  #avatar {
    position: absolute;
    inset: 0;
  }

  #avatarSvg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    shape-rendering: geometricPrecision;
    text-rendering: geometricPrecision;
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .avatar-stage::before {
    content: '';
    position: absolute;
    top: 20%; left: 50%;
    transform: translateX(-50%);
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(126,200,227,0.15) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  .eye-group {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.09s ease-in-out;
    will-change: transform;
  }
  .eye-group.blink {
    transform: scaleY(0.08);
  }

  .eye-group path,
  .eye-group ellipse,
  .eye-group circle {
    shape-rendering: geometricPrecision;
  }

  #browLeft, #browRight { transition: transform 0.5s ease-out; }
  #blushLeft, #blushRight { transition: opacity 0.6s ease; }
  #foreheadHighlight { transition: opacity 0.5s ease; }

  #mouthGroup { transition: none; }

  .status {
    position: absolute;
    bottom: -24px; left: 0; right: 0;
    font-size: 0.75em;
    color: #7ec8e3;
    min-height: 1.2em;
    letter-spacing: 0.02em;
    z-index: 2;
  }

  .conn-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.7em;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.3);
    transition: all 0.3s;
    align-self: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conn-badge.ok   { background: rgba(76,175,80,0.25);  color: #a5d6a7; }
  .conn-badge.bad  { background: rgba(244,67,54,0.25);  color: #ef9a9a; }
  .conn-badge.wait { background: rgba(255,193,7,0.25);  color: #ffe082; }

  .chat-log {
    position: relative;
    height: 160px;
    min-height: 110px;
    overflow-y: auto;
    overflow-x: hidden;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 12px;
    text-align: left;
    font-size: 0.82em;
    -webkit-overflow-scrolling: touch;
  }
  .chat-log::-webkit-scrollbar { width: 6px; }
  .chat-log::-webkit-scrollbar-track { background: transparent; }
  .chat-log::-webkit-scrollbar-thumb {
    background: rgba(126,200,227,0.35);
    border-radius: 3px;
  }
  .chat-log::-webkit-scrollbar-thumb:hover {
    background: rgba(126,200,227,0.6);
  }

  .msg {
    margin-bottom: 8px;
    line-height: 1.4;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    animation: msgFadeIn 0.35s ease-out;
  }
  @keyframes msgFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user   { color: #a8d8ea; }
  .msg.bot    { color: #ffd9a0; }
  .msg .who   { font-weight: bold; font-size: 0.8em; opacity: 0.7; }

  .msg.typing .who { opacity: 0.5; }
  .msg.typing .dots::after {
    content: '';
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }

  .input-row { display: flex; gap: 6px; margin-bottom: 8px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    padding: 12px 14px;
    border: none; border-radius: 10px;
    background: rgba(255,255,255,0.12);
    color: #fff; font-size: 1em; outline: none;
  }
  input::placeholder { color: rgba(255,255,255,0.5); }

  button {
    padding: 12px 18px;
    border: none; border-radius: 10px;
    background: #7ec8e3; color: #16213e;
    font-weight: bold; cursor: pointer;
    transition: background 0.2s;
    font-size: 0.95em;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  button:hover { background: #a8d8ea; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .action-bar {
    display: flex; gap: 6px;
    margin-bottom: 10px;
    flex-wrap: nowrap;
  }
  .action-bar button {
    flex: 1;
    padding: 10px 6px;
    font-size: 0.72em;
    font-weight: 600;
    background: rgba(255,255,255,0.1);
    color: #7ec8e3;
    border: 1px solid rgba(126,200,227,0.3);
    border-radius: 8px;
    transition: background 0.2s, border-color 0.2s;
    min-width: 0;
  }
  .action-bar button:hover {
    background: rgba(126,200,227,0.2);
    border-color: #7ec8e3;
  }
  .action-bar button.primary {
    background: #7ec8e3; color: #16213e;
    border-color: #7ec8e3;
  }
  .action-bar button.primary:hover { background: #a8d8ea; }

  .settings { margin-top: 10px; font-size: 0.8em; text-align: left; }
  .settings label { display: block; margin-bottom: 6px; opacity: 0.7; }
  .settings input {
    width: 100%; margin-top: 4px; padding: 8px;
    background: rgba(0,0,0,0.3); border: none;
    border-radius: 6px; color: #7ec8e3; font-size: 0.9em;
  }
  .hidden-url { display: none; }

  @media (max-width: 380px) {
    .container { padding: 16px 12px; border-radius: 14px; }
    h1 { font-size: 1em; margin-bottom: 10px; }
    .avatar-stage { width: 170px; height: 204px; margin-bottom: 18px; }
    .status { font-size: 0.7em; bottom: -20px; }
    .chat-log { height: 130px; font-size: 0.78em; }
    .action-bar button { font-size: 0.65em; padding: 9px 4px; }
    button { padding: 11px 14px; font-size: 0.88em; }
    input[type="text"] { padding: 11px 12px; font-size: 0.95em; }
  }

  @media (max-height: 600px) and (orientation: landscape) {
    .container {
      max-width: 700px;
      padding: 16px 20px;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-start;
    }
    h1 { width: 100%; font-size: 1em; margin-bottom: 8px; }
    .conn-badge { width: 100%; margin-bottom: 8px; }
    .avatar-stage { width: 150px; height: 180px; margin: 0 16px 0 0; }
    .chat-log { flex: 1; min-width: 200px; height: 120px; margin-bottom: 8px; }
    .action-bar { width: 100%; margin-bottom: 6px; }
    .input-row { width: 100%; }
    .status { font-size: 0.68em; bottom: -18px; }
    .action-bar button { font-size: 0.7em; padding: 8px 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar-bob, .avatar-bob.talking, .avatar-bob:not(.talking) {
      animation: none !important;
    }
    .eye-group, #browLeft, #browRight,
    #blushLeft, #blushRight, #foreheadHighlight {
      transition: none !important;
    }
    .msg { animation: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🗣️ Ivie AI — Talking Avatar</h1>

  <div class="conn-badge wait" id="connBadge">⏳ Checking connection...</div>

  <div class="avatar-stage">
    <div class="avatar-bob" id="avatarBob">
      <div class="avatar" id="avatar">
        <svg id="avatarSvg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="skinGrad" cx="45%" cy="35%" r="70%">
              <stop offset="0%"   stop-color="#d9a271"/>
              <stop offset="55%"  stop-color="#b97c4a"/>
              <stop offset="100%" stop-color="#8a5328"/>
            </radialGradient>
            <linearGradient id="neckGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#a76b3a"/>
              <stop offset="100%" stop-color="#7a4820"/>
            </linearGradient>
            <radialGradient id="hairGrad" cx="50%" cy="30%" r="75%">
              <stop offset="0%"   stop-color="#4a2e1c"/>
              <stop offset="60%"  stop-color="#2b1b12"/>
              <stop offset="100%" stop-color="#160d08"/>
            </radialGradient>
            <linearGradient id="hairHighlight" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"   stop-color="#6b4327" stop-opacity="0.6"/>
              <stop offset="50%"  stop-color="#3a2416" stop-opacity="0"/>
              <stop offset="100%" stop-color="#1a0f08" stop-opacity="0.4"/>
            </linearGradient>
            <radialGradient id="eyeWhite" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#ffffff"/>
              <stop offset="85%"  stop-color="#f2ede6"/>
              <stop offset="100%" stop-color="#d6cec2"/>
            </radialGradient>
            <radialGradient id="irisGrad" cx="50%" cy="45%" r="55%">
              <stop offset="0%"   stop-color="#5a3418"/>
              <stop offset="45%"  stop-color="#331d0a"/>
              <stop offset="100%" stop-color="#150902"/>
            </radialGradient>
            <linearGradient id="lipGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#a04a45"/>
              <stop offset="50%"  stop-color="#853a35"/>
              <stop offset="100%" stop-color="#632824"/>
            </linearGradient>
            <linearGradient id="clothGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#5a7fb8"/>
              <stop offset="100%" stop-color="#3a5a8a"/>
            </linearGradient>
            <radialGradient id="blush" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#c96e4c" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#c96e4c" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="noseShadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#8a5328" stop-opacity="0.75"/>
              <stop offset="100%" stop-color="#8a5328" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#f9e79f"/>
              <stop offset="35%"  stop-color="#f4d03f"/>
              <stop offset="55%"  stop-color="#d4ac0d"/>
              <stop offset="80%"  stop-color="#b9770e"/>
              <stop offset="100%" stop-color="#f4d03f"/>
            </linearGradient>
            <linearGradient id="goldShine" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"   stop-color="#fff8d0" stop-opacity="0.9"/>
              <stop offset="50%"  stop-color="#fff8d0" stop-opacity="0"/>
              <stop offset="100%" stop-color="#fff8d0" stop-opacity="0.6"/>
            </linearGradient>
            <linearGradient id="pendantGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#c9932a"/>
              <stop offset="50%"  stop-color="#a67816"/>
              <stop offset="100%" stop-color="#7a5a0c"/>
            </linearGradient>
            <radialGradient id="earringGrad" cx="35%" cy="30%" r="75%">
              <stop offset="0%"   stop-color="#fef2b8"/>
              <stop offset="30%"  stop-color="#f4d03f"/>
              <stop offset="65%"  stop-color="#b9770e"/>
              <stop offset="100%" stop-color="#7d5a09"/>
            </radialGradient>
            <radialGradient id="earringInner" cx="35%" cy="30%" r="70%">
              <stop offset="0%"   stop-color="#fff8d0"/>
              <stop offset="45%"  stop-color="#e6bf26"/>
              <stop offset="100%" stop-color="#8a640a"/>
            </radialGradient>
            <radialGradient id="tearGrad" cx="40%" cy="30%" r="70%">
              <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
              <stop offset="60%"  stop-color="#bfe6ff" stop-opacity="0.85"/>
              <stop offset="100%" stop-color="#7ec8e3" stop-opacity="0.7"/>
            </radialGradient>
            <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
              <feOffset dx="0" dy="1" result="offsetblur"/>
              <feComponentTransfer>
                <feFuncA type="linear" slope="0.25"/>
              </feComponentTransfer>
              <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <filter id="hairSoft">
              <feGaussianBlur stdDeviation="0.4"/>
            </filter>
            <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="0.8" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- Body -->
          <path d="M 30 240 Q 30 195 65 182 L 135 182 Q 170 195 170 240 Z"
                fill="url(#clothGrad)" stroke="#2c4468" stroke-width="0.8"/>
          <path d="M 82 182 Q 100 195 118 182 L 122 190 Q 100 203 78 190 Z"
                fill="#4a6fa5" opacity="0.85"/>
          <path d="M 78 182 Q 100 194 122 182 L 120 187 Q 100 198 80 187 Z"
                fill="#2c4468" opacity="0.5"/>

          <!-- Neck -->
          <path d="M 82 155 L 82 185 Q 100 192 118 185 L 118 155 Z"
                fill="url(#neckGrad)"/>
          <ellipse cx="100" cy="158" rx="22" ry="7" fill="#7a4820" opacity="0.55"/>

          <!-- NECKLACE -->
          <g id="necklaceGroup">
            <path d="M 76 186 Q 82 200 96 204"
                  fill="none" stroke="url(#goldGrad)" stroke-width="2.2"
                  stroke-linecap="round" filter="url(#goldGlow)"/>
            <path d="M 124 186 Q 118 200 104 204"
                  fill="none" stroke="url(#goldGrad)" stroke-width="2.2"
                  stroke-linecap="round" filter="url(#goldGlow)"/>
            <path d="M 77 188 Q 83 199 95 203"
                  fill="none" stroke="url(#goldShine)" stroke-width="0.7"
                  stroke-linecap="round" opacity="0.9"/>
            <path d="M 123 188 Q 117 199 105 203"
                  fill="none" stroke="url(#goldShine)" stroke-width="0.7"
                  stroke-linecap="round" opacity="0.9"/>
            <circle cx="76" cy="186" r="1.6" fill="url(#goldGrad)"/>
            <circle cx="124" cy="186" r="1.6" fill="url(#goldGrad)"/>

            <g id="pendantGroup">
              <ellipse cx="100" cy="211" rx="14" ry="2" fill="#3a2408" opacity="0.45"/>
              <rect x="85" y="202.5" width="30" height="15" rx="4"
                    fill="url(#pendantGrad)" stroke="#5c400a" stroke-width="0.8"/>
              <rect x="87" y="204.5" width="26" height="11" rx="3"
                    fill="none" stroke="#5c400a" stroke-width="0.5" opacity="0.8"/>
              <circle cx="100" cy="202" r="2.4"
                      fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
              <path d="M 88 204.5 Q 92 203.5 96 204.5 L 95 205.5 Q 92 205 89 205.5 Z"
                    fill="#fff8d0" opacity="0.55"/>

              <text x="100" y="214"
                    font-family="'Trebuchet MS', 'Segoe UI', Helvetica, Arial, sans-serif"
                    font-size="7"
                    font-weight="800"
                    text-anchor="middle"
                    fill="#fffbe8"
                    stroke="#4a3204"
                    stroke-width="0.55"
                    stroke-linejoin="round"
                    paint-order="stroke fill"
                    letter-spacing="0.1">nAIja</text>
            </g>
          </g>

          <!-- Ears -->
          <ellipse cx="58" cy="118" rx="6.5" ry="12" fill="#b97c4a" stroke="#8a5328" stroke-width="0.6"/>
          <ellipse cx="142" cy="118" rx="6.5" ry="12" fill="#b97c4a" stroke="#8a5328" stroke-width="0.6"/>
          <ellipse cx="58" cy="118" rx="3" ry="6" fill="#8a5328" opacity="0.65"/>
          <ellipse cx="142" cy="118" rx="3" ry="6" fill="#8a5328" opacity="0.65"/>

          <!-- EARRINGS -->
          <g id="earringLeft">
            <ellipse cx="58" cy="133.5" rx="4.6" ry="1.4" fill="#3a2408" opacity="0.35"/>
            <circle cx="58" cy="131.5" r="4.4"
                    fill="url(#earringGrad)" stroke="#7d5a09" stroke-width="0.5"
                    filter="url(#goldGlow)"/>
            <circle cx="58" cy="131.5" r="3.1"
                    fill="none" stroke="#7d5a09" stroke-width="0.35" opacity="0.75"/>
            <circle cx="58" cy="131.5" r="2.1" fill="url(#earringInner)"/>
            <ellipse cx="56.8" cy="129.9" rx="1.3" ry="1"
                     fill="#fffbe8" opacity="0.75"
                     transform="rotate(-25 56.8 129.9)"/>
            <path d="M 55 134 Q 58 135.2 61 134"
                  stroke="#fff8d0" stroke-width="0.45" fill="none"
                  opacity="0.55" stroke-linecap="round"/>
          </g>

          <g id="earringRight">
            <ellipse cx="142" cy="133.5" rx="4.6" ry="1.4" fill="#3a2408" opacity="0.35"/>
            <circle cx="142" cy="131.5" r="4.4"
                    fill="url(#earringGrad)" stroke="#7d5a09" stroke-width="0.5"
                    filter="url(#goldGlow)"/>
            <circle cx="142" cy="131.5" r="3.1"
                    fill="none" stroke="#7d5a09" stroke-width="0.35" opacity="0.75"/>
            <circle cx="142" cy="131.5" r="2.1" fill="url(#earringInner)"/>
            <ellipse cx="140.8" cy="129.9" rx="1.3" ry="1"
                     fill="#fffbe8" opacity="0.75"
                     transform="rotate(-25 140.8 129.9)"/>
            <path d="M 139 134 Q 142 135.2 145 134"
                  stroke="#fff8d0" stroke-width="0.45" fill="none"
                  opacity="0.55" stroke-linecap="round"/>
          </g>

          <!-- Face -->
          <path d="M 62 78 Q 58 100 60 120 Q 62 145 80 158 Q 100 165 120 158
                   Q 138 145 140 120 Q 142 100 138 78 Q 130 55 100 52 Q 70 55 62 78 Z"
                fill="url(#skinGrad)" filter="url(#softShadow)"/>

          <ellipse id="blushLeft" cx="74" cy="128" rx="10" ry="6"
                   fill="url(#blush)" opacity="0.85"/>
          <ellipse id="blushRight" cx="126" cy="128" rx="10" ry="6"
                   fill="url(#blush)" opacity="0.85"/>

          <!-- Hair -->
          <path d="M 55 70 Q 52 40 75 28 Q 100 18 125 28 Q 148 40 145 70 L 148 95
                   Q 145 78 138 72 Q 130 55 100 52 Q 70 55 62 72 Q 55 78 52 95 Z"
                fill="url(#hairGrad)" filter="url(#hairSoft)"/>
          <path d="M 55 70 Q 48 85 52 105 Q 55 118 60 120 Q 58 100 62 78 Z"
                fill="url(#hairGrad)" opacity="0.95"/>
          <path d="M 145 70 Q 152 85 148 105 Q 145 118 140 120 Q 142 100 138 78 Z"
                fill="url(#hairGrad)" opacity="0.95"/>
          <path d="M 70 40 Q 90 25 120 32 Q 140 42 143 65 Q 130 50 100 48 Q 75 50 65 68 Q 62 55 70 40 Z"
                fill="url(#hairHighlight)"/>
          <path d="M 62 72 Q 70 58 88 55 Q 100 53 112 55 Q 130 58 138 72 Q 130 62 100 60 Q 70 62 62 72 Z"
                fill="#1a0f08" opacity="0.55"/>

          <!-- Eyebrows -->
          <g id="browLeft" transform-box="fill-box" transform-origin="center">
            <path d="M 70 92 Q 80 87 92 90" stroke="#2b1b12" stroke-width="2.2"
                  stroke-linecap="round" fill="none" opacity="0.95"/>
          </g>
          <g id="browRight" transform-box="fill-box" transform-origin="center">
            <path d="M 108 90 Q 120 87 130 92" stroke="#2b1b12" stroke-width="2.2"
                  stroke-linecap="round" fill="none" opacity="0.95"/>
          </g>

          <!-- Left eye -->
          <g class="eye-group" id="leftEye">
            <ellipse cx="80" cy="108" rx="10" ry="7" fill="#9c6234" opacity="0.55"/>
            <ellipse cx="80" cy="107" rx="9" ry="6.5" fill="url(#eyeWhite)"/>
            <circle cx="80" cy="107" r="4.5" fill="url(#irisGrad)"/>
            <circle cx="80" cy="107" r="2" fill="#0a0502"/>
            <circle cx="81.5" cy="105.5" r="1.3" fill="#fff" opacity="0.85"/>
            <path d="M 71 110 Q 80 113 89 110" stroke="#3a2416" stroke-width="0.6"

function getIdleElapsedMs() {

}

function resetIdleAppearance() {
  applyExpression(1);
  tearEl.style.opacity = '0';
  setSadMouth(false);
  avatarBob.style.transition = 'transform 1s ease-in-out';
  avatarBob.style.transform  = '';
}

function triggerIdleMood(withTear) {
  if (idleMoodTimeout) { clearTimeout(idleMoodTimeout); idleMoodTimeout = null; }

  currentIdleState = withTear ? 'tear' : 'sad';
  applySadFace(withTear);

  idleMoodTimeout = setTimeout(() => {
    idleMoodTimeout = null;
    currentIdleState = null;
    resetIdleAppearance();
  }, IDLE_MOOD_DURATION_MS);
}

function evaluateIdleState() {
  if (!idleActive) return;
  if (avatarBob.classList.contains('talking')) return;

  const elapsed = getIdleElapsedMs();
  const milestone = Math.floor(elapsed / IDLE_SAD_DELAY_MS);

  if (milestone > idleMilestoneCount && milestone > 0) {
    idleMilestoneCount = milestone;
    const withTear = (milestone % 2 === 0);
    triggerIdleMood(withTear);
  }
}

function idleTick() {
  if (!idleActive) return;
  if (!avatarBob.classList.contains('talking')) {
    evaluateIdleState();
  }
  idleTimer = setTimeout(idleTick, IDLE_TICK_MS);
}

function startIdleLoop() {
  stopIdleLoop();
  idleActive = true;
  idleStartTime = performance.now();
  idleMilestoneCount = 0;
  currentIdleState = null;
  idleTimer = setTimeout(idleTick, IDLE_TICK_MS);
}

function stopIdleLoop() {
  idleActive = false;

/* =========================================================
   CHAT SCROLL CONTROLLER
   ========================================================= */
const chatScroller = {
  activeMsgEl: null,
  msgTop: 0,
  msgBottom: 0,
  progress: 0,
  userOverride: false,
  rafId: null,

  snapBottom(smooth = false) {
    this.progress = 1;
    if (smooth && typeof chatLog.scrollTo === 'function') {
      try {
        chatLog.scrollTo({ top: chatLog.scrollHeight, behavior: 'smooth' });
        return;
      } catch (e) { /* fall through */ }
    }
    chatLog.scrollTop = chatLog.scrollHeight;
  },

  trackMessageForSpeech(msgEl) {
    this.stopTracking();
    if (!msgEl) return;
    this.activeMsgEl = msgEl;
    this.userOverride = false;

    const logRect = chatLog.getBoundingClientRect();
    const msgRect = msgEl.getBoundingClientRect();
    const scrollTopNow = chatLog.scrollTop;

    const msgTopInContent    = (msgRect.top    - logRect.top) + scrollTopNow;
    const msgBottomInContent = (msgRect.bottom - logRect.top) + scrollTopNow;

    const panelH   = chatLog.clientHeight;
    const contentH = chatLog.scrollHeight;
    const padTop   = 6;

    const startScroll = Math.max(0, msgTopInContent - padTop);
    const endScroll   = Math.min(
      contentH - panelH,
      Math.max(0, msgBottomInContent - panelH + padTop)
    );

    if (endScroll <= startScroll) {
      this.snapBottom();
      this.activeMsgEl = null;
      return;
    }

    this.msgTop    = startScroll;
    this.msgBottom = endScroll;

    chatLog.scrollTop = this.msgTop;
    this._loop();
  },

  setProgress(p) {
    this.progress = Math.max(0, Math.min(1, p));
  },

  stopTracking() {
    if (this.rafId) {
      cancelAnimationFrame(this.rafId);
      this.rafId = null;
    }
    this.activeMsgEl = null;
    this.userOverride = false;
  },

  _loop() {
    if (!this.activeMsgEl) { this.rafId = null; return; }
    if (this.userOverride) { this.rafId = null; return; }

    const target = this.msgTop + (this.msgBottom - this.msgTop) * this.progress;
    const current = chatLog.scrollTop;
    const diff = target - current;

    if (Math.abs(diff) > 0.4) {
      chatLog.scrollTop = current + diff * 0.22;
    } else {
      chatLog.scrollTop = target;
    }

    this.rafId = requestAnimationFrame(() => this._loop());
  }
};

/* ---------- Extract reply ---------- */
function extractReply(data) {
  if (typeof data === 'string') return data;
  if (Array.isArray(data)) return extractReply(data[0]);
  if (data && typeof data === 'object') {
    for (const key of ['response','reply','answer','output','text','message']) {
      if (key in data) return extractReply(data[key]);
    }
    for (const v of Object.values(data)) {
      if (typeof v === 'string' && v.trim()) return v;
    }
  }
  return JSON.stringify(data);
}

/* ---------- Query model ---------- */
async function queryModel(message) {
  const base = endpoint.value.trim().replace(/\/+$/, '');
  if (!base) throw new Error('Service unavailable.');
  const res = await fetch(`${base}/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message })
  });
  if (!res.ok) throw new Error(`Service error (HTTP ${res.status})`);
  const contentType = res.headers.get('content-type') || '';
  const data = contentType.includes('json') ? await res.json() : await res.text();
  const reply = extractReply(data);
  if (!reply || !reply.trim()) throw new Error('Empty response from Ivie AI');
  return reply.trim();
}

/* =========================================================
   VOICE SELECTION
   ========================================================= */
let cachedVoice = null;

function isEnglishVoice(v) {
  if (!v) return false;
  const lang = (v.lang || '').toLowerCase();
  const name = (v.name || '').toLowerCase();
  return lang.startsWith('en') ||
         /english|en[-_]/.test(name) ||
         /(samantha|victoria|karen|moira|fiona|tessa|zira|aria|jenny|serena|ava|susan|allison|nicky|ezinne|ada|ngozi|chioma|amara)/.test(name);
}

function isNigerianVoice(v) {
  if (!v) return false;
  const lang = (v.lang || '').toLowerCase();
  const name = (v.name || '').toLowerCase();
  if (lang.startsWith('en-ng')) return true;
  if (lang.includes('nigeria')) return true;
  if (/nigeria|ezinne|ngozi|chioma|amara|\bada\b/i.test(name)) return true;
  return false;
}

function isAfricanVoice(v) {
  if (!v) return false;
  const lang = (v.lang || '').toLowerCase();
  const name = (v.name || '').toLowerCase();

  if (AFRICAN_LANG_PREFIXES.some(prefix => lang.startsWith(prefix))) return true;
  if (AFRICAN_VOICE_HINTS.some(hint =>
        name.includes(hint.toLowerCase()) ||
        lang.includes(hint.toLowerCase()))) return true;
  if (/african|afrikaans/i.test(name)) return true;

  return false;
}

function isFemaleVoice(v) {
  if (!v) return false;
  return FEMALE_NAME_MARKERS.test(v.name || '');
}

function pickFemaleAfricanVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;

  const englishOnly = voices.filter(isEnglishVoice);
  const pool = englishOnly.length > 0 ? englishOnly : voices;

  const femaleAfricanNigerian = pool.find(v =>
    isAfricanVoice(v) && isFemaleVoice(v) && isNigerianVoice(v)
  );
  if (femaleAfricanNigerian) {
    console.log('[Ivie] Voice: Female African (Nigerian) →',
                femaleAfricanNigerian.name, '(' + femaleAfricanNigerian.lang + ')');
    return femaleAfricanNigerian;
  }

  const femaleAfricanOther = pool.find(v =>
    isAfricanVoice(v) && isFemaleVoice(v)
  );
  if (femaleAfricanOther) {
    console.log('[Ivie] Voice: Female African (other) →',
                femaleAfricanOther.name, '(' + femaleAfricanOther.lang + ')');
    return femaleAfricanOther;
  }

  const anyAfrican = pool.find(v => isAfricanVoice(v));
  if (anyAfrican) {
    console.log('[Ivie] Voice: African (any gender) →',
                anyAfrican.name, '(' + anyAfrican.lang + ')');
    return anyAfrican;
  }

  for (const hint of FEMALE_ENGLISH_HINTS) {
    const v = pool.find(v => v.name.toLowerCase().includes(hint.toLowerCase()));
    if (v) {
      console.log('[Ivie] Voice: Female English (fallback) →',
                  v.name, '(' + v.lang + ')');
      return v;
    }
  }

  const anyEnglish = pool.find(isEnglishVoice);
  if (anyEnglish) {
    console.log('[Ivie] Voice: English (fallback) →',
                anyEnglish.name, '(' + anyEnglish.lang + ')');
    return anyEnglish;
  }

  console.log('[Ivie] Voice: system default →',
              voices[0].name, '(' + voices[0].lang + ')');
  return voices[0];
}

function refreshVoice() {
  cachedVoice = pickFemaleAfricanVoice();
}

if ('speechSynthesis' in window) {
  refreshVoice();
  speechSynthesis.onvoiceschanged = refreshVoice;

  UH: { open: 0.30, width: 0.95, round: 0.20 },
  UW: { open: 0.28, width: 0.80, round: 0.65 },
  M:  { open: 0.02, width: 0.95, round: 0.00 },
  B:  { open: 0.05, width: 0.95, round: 0.00 },
  P:  { open: 0.05, width: 0.95, round: 0.00 },
  F:  { open: 0.15, width: 1.00, round: 0.00 },
  V:  { open: 0.18, width: 1.00, round: 0.00 },
  TH: { open: 0.18, width: 0.95, round: 0.00 },
  DH: { open: 0.18, width: 0.95, round: 0.00 },
  S:  { open: 0.15, width: 1.10, round: 0.00 },
  Z:  { open: 0.15, width: 1.10, round: 0.00 },
  SH: { open: 0.25, width: 0.80, round: 0.55 },
  CH: { open: 0.20, width: 0.85, round: 0.40 },
  JH: { open: 0.22, width: 0.85, round: 0.40 },
  T:  { open: 0.15, width: 1.05, round: 0.00 },
  D:  { open: 0.18, width: 1.05, round: 0.00 },
  N:  { open: 0.15, width: 1.00, round: 0.00 },
  L:  { open: 0.30, width: 1.05, round: 0.00 },
  R:  { open: 0.35, width: 0.90, round: 0.30 },
  W:  { open: 0.20, width: 0.80, round: 0.60 },
  Y:  { open: 0.22, width: 1.10, round: 0.00 },
  K:  { open: 0.20, width: 1.05, round: 0.00 },
  G:  { open: 0.22, width: 1.05, round: 0.00 },
  HH: { open: 0.35, width: 1.00, round: 0.00 },
  REST: { open: 0.00, width: 1.00, round: 0.00 }
};

const VISEME_WEIGHTS = {
  AA: 1.6, AE: 1.4, AH: 1.2, AO: 1.5, AW: 1.4, AY: 1.5, EH: 1.3, ER: 1.3,
  EY: 1.4, IH: 1.1, IY: 1.2, OH: 1.5, OW: 1.4, OY: 1.4, UH: 1.0, UW: 1.2,
  M: 0.7, B: 0.7, P: 0.7,
  F: 0.9, V: 0.9, TH: 0.9, DH: 0.9, S: 0.9, Z: 0.9,
  SH: 1.0, CH: 0.9, JH: 0.9,
  T: 0.8, D: 0.8, N: 0.8, K: 0.8, G: 0.8,
  L: 1.0, R: 1.1, W: 0.9, Y: 0.9, HH: 0.8,
  REST: 0.9
};

function textToWeightedVisemes(text) {
  const clean = text.toLowerCase().replace(/[^a-z\s.,!?;:'"-]/g, '');
  const tokens = clean.split(/(\s+|[.,!?;:])/).filter(t => t.length > 0);
  const stream = [];

  for (const token of tokens) {
    if (/^[.,!?;:]+$/.test(token)) {
      const isSentence = /[.!?]/.test(token);
      stream.push({ viseme: 'REST', weight: isSentence ? 2.6 : 1.4 });
      continue;
    }
    if (/^\s+$/.test(token)) {
      stream.push({ viseme: 'REST', weight: 0.55 });
      continue;
    }

    const w = token;
    let i = 0;
    while (i < w.length) {
      const c  = w[i];
      const c2 = w.substr(i, 2);
      let key = null;
      let advance = 1;

      if (c2 === 'th') { key = 'TH'; advance = 2; }
      else if (c2 === 'sh') { key = 'SH'; advance = 2; }
      else if (c2 === 'ch') { key = 'CH'; advance = 2; }
      else if (c2 === 'ph') { key = 'F';  advance = 2; }
      else if (c2 === 'wh') { key = 'W';  advance = 2; }
      else if (c2 === 'ck') { key = 'K';  advance = 2; }
      else if (c2 === 'ng') { key = 'N';  advance = 2; }
      else if (c2 === 'oo') { key = 'UW'; advance = 2; }
      else if (c2 === 'ee') { key = 'IY'; advance = 2; }
      else if (c2 === 'ea') { key = 'IY'; advance = 2; }
      else if (c2 === 'ai') { key = 'EY'; advance = 2; }
      else if (c2 === 'ay') { key = 'EY'; advance = 2; }
      else if (c2 === 'ou') { key = 'AW'; advance = 2; }
      else if (c2 === 'ow') { key = 'OW'; advance = 2; }
      else if (c2 === 'oi') { key = 'OY'; advance = 2; }
      else if (c2 === 'oy') { key = 'OY'; advance = 2; }
      else if (c2 === 'au') { key = 'AO'; advance = 2; }
      else if (c2 === 'aw') { key = 'AO'; advance = 2; }
      else if (c2 === 'er') { key = 'ER'; advance = 2; }
      else if (c2 === 'ir') { key = 'ER'; advance = 2; }
      else if (c2 === 'ur') { key = 'ER'; advance = 2; }

      if (!key) {
        switch (c) {
          case 'a': key = 'AE'; break;
          case 'e': key = 'EH'; break;
          case 'i': key = 'IH'; break;
          case 'o': key = 'OH'; break;
          case 'u': key = 'AH'; break;
          case 'y': key = 'Y';  break;
          case 'm': key = 'M';  break;
          case 'b': key = 'B';  break;
          case 'p': key = 'P';  break;
          case 'f': key = 'F';  break;
          case 'v': key = 'V';  break;
          case 's': key = 'S';  break;
          case 'z': key = 'Z';  break;
          case 't': key = 'T';  break;
          case 'd': key = 'D';  break;
          case 'n': key = 'N';  break;
          case 'l': key = 'L';  break;
          case 'r': key = 'R';  break;
          case 'w': key = 'W';  break;
          case 'k': key = 'K';  break;
          case 'g': key = 'G';  break;
          case 'h': key = 'HH'; break;
          case 'c': key = 'K';  break;
          case 'j': key = 'JH'; break;
          case 'x': key = 'K';  break;
          case 'q': key = 'K';  break;
          default:  key = 'AH';
        }
      }

      stream.push({ viseme: key, weight: VISEME_WEIGHTS[key] || 1.0 });
      i += advance;
    }

    stream.push({ viseme: 'REST', weight: 0.35 });
  }

  return stream;
}

/* =========================================================
   MOUTH RENDERER
   ========================================================= */

let mouthRAF = null;
let mouthState = null;
let mouthStartDelayTimer = null;
let mouthIsClosing = false;   // ★ freeze flag — prevents new frames once closing begins

function stopMouthAnimation() {
  if (mouthRAF) {
    cancelAnimationFrame(mouthRAF);
    mouthRAF = null;
  }
  if (mouthStartDelayTimer) {
    clearTimeout(mouthStartDelayTimer);
    mouthStartDelayTimer = null;
  }
  mouthState = null;
  mouthIsClosing = false;
  renderMouth({ open: 0, width: 1, round: 0 }, 1);
}

function buildMouthPaths(shape, progress) {
  const open  = Math.max(0, Math.min(1, shape.open)) * progress;
  const width = shape.width || 1.0;
  const round = shape.round || 0;

  const upperY = 143 - open * 1.2;

  const lowerTop    = 145 + open * 1.5;
  const lowerBottom = 148 + open * 7.5;

  const halfWidth = (13 * width) - (round * 2.5);

  const upperLipPath =
    `M ${100 - halfWidth} ${upperY}
     Q ${100 - halfWidth * 0.55} ${upperY - 1.6} 100 ${upperY + 0.4}
     Q ${100 + halfWidth * 0.55} ${upperY - 1.6} ${100 + halfWidth} ${upperY}
     Q ${100 + halfWidth * 0.55} ${upperY + 2.2} 100 ${upperY + 2.8}
     Q ${100 - halfWidth * 0.55} ${upperY + 2.2} ${100 - halfWidth} ${upperY} Z`;

  const lowerLipPath =
    `M ${100 - halfWidth} ${lowerTop}
     Q 100 ${lowerBottom} ${100 + halfWidth} ${lowerTop}
     Q ${100 + halfWidth - 1.5} ${lowerTop + 1.2} 100 ${lowerTop + 2.2}
     Q ${100 - halfWidth + 1.5} ${lowerTop + 1.2} ${100 - halfWidth} ${lowerTop} Z`;

  const cavityRx = halfWidth * 0.85;
  const cavityRy = open * 8.5 + 0.6;
  const cavityCy = 146 + open * 2;

  const highlightPath =
    `M ${100 - halfWidth * 0.5} ${lowerTop + 0.8}
     Q 100 ${lowerTop + 1.8} ${100 + halfWidth * 0.5} ${lowerTop + 0.8}`;

  return {
    upper: upperLipPath,
    lower: lowerLipPath,
    highlight: highlightPath,
    cavityRx, cavityRy, cavityCy
  };
}

function renderMouth(shape, progress) {
  const p = buildMouthPaths(shape, progress);
  domUpperLip.setAttribute('d', p.upper);
  domLowerLip.setAttribute('d', p.lower);
  domLipHighlight.setAttribute('d', p.highlight);
  domMouthCavity.setAttribute('rx', p.cavityRx.toFixed(2));
  domMouthCavity.setAttribute('ry', p.cavityRy.toFixed(2));
  domMouthCavity.setAttribute('cy', p.cavityCy.toFixed(2));
}

/* =========================================================
   SPEECH DURATION ESTIMATOR
   ========================================================= */
function estimateSpeechDurationMs(visemeStream, rate) {
  const totalWeight = visemeStream.reduce((s, v) => s + v.weight, 0);
  const baseMs = totalWeight * SPEECH_MS_PER_WEIGHT;
  return baseMs / (rate || 1.0);
}

/* =========================================================
   PLAYBACK ENGINE  ★ REVISED
   -----------------------------------------------------
   Fixes the "lip flap at the end of speech":

     • mouthIsClosing is set to true the instant finish is
       called. Any RAF frame that was already queued finds
       this flag set and returns immediately, so no stray
       viseme can be rendered between the last spoken word
       and the start of the closing animation.

     • The close begins from a *frozen snapshot* of the
       current mouth shape, not from a live value that could
       still be updated by a racing frame.

     • If the current openness is already very small, the
       close is skipped entirely and the mouth snaps to
       rest — because a 180 ms fade from "barely open" to
       closed reads as a twitch, not a motion.
   ========================================================= */

function startMouthAnimation(text, rate) {
  stopMouthAnimation();

  const stream = textToWeightedVisemes(text);
  if (stream.length === 0) return;

  const totalWeight = stream.reduce((s, v) => s + v.weight, 0);
  const estimatedDuration = estimateSpeechDurationMs(stream, rate);

  const cumulative = [0];
  for (let i = 0; i < stream.length; i++) {
    cumulative.push(cumulative[i] + stream[i].weight);
  }

  mouthIsClosing = false;

  mouthState = {
    stream,
    cumulative,
    totalWeight,
    estimatedDuration,
    startTime: null,
    lastProgress: 0,
    rateMult: 1.0,
    lastRenderedShape: { open: 0, width: 1, round: 0 }
  };

  function shapeAtProgress(p) {
    const target = p * mouthState.totalWeight;
    let lo = 0, hi = mouthState.cumulative.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (mouthState.cumulative[mid] <= target) lo = mid;
      else hi = mid;
    }
    const curIdx = lo;
    const nextIdx = Math.min(curIdx + 1, mouthState.stream.length - 1);
    const cur = mouthState.stream[curIdx];
    const next = mouthState.stream[nextIdx];

    const segStart = mouthState.cumulative[curIdx];
    const segEnd   = mouthState.cumulative[curIdx + 1] || mouthState.cumulative[curIdx];
    const segP = segEnd > segStart ? (target - segStart) / (segEnd - segStart) : 0;

    const ease = segP < 0.5 ? 2 * segP * segP : 1 - Math.pow(-2 * segP + 2, 2) / 2;

    const sCur  = VISEMES[cur.viseme]  || VISEMES.REST;
    const sNext = VISEMES[next.viseme] || VISEMES.REST;

    return {
      open:  sCur.open  + (sNext.open  - sCur.open)  * ease,
      width: sCur.width + (sNext.width - sCur.width) * ease,
      round: sCur.round + (sNext.round - sCur.round) * ease
    };
  }

  function loop(now) {
    // ★ If closing has begun, abandon any queued frames.
    if (mouthIsClosing) {
      mouthRAF = null;
      return;
    }
    if (!mouthState || !avatarBob.classList.contains('talking')) {
      mouthRAF = null;
      return;
    }

    if (mouthState.startTime === null) {
      mouthState.startTime = now;
    }

    const elapsed = now - mouthState.startTime;
    const expectedProgress = Math.min(1, elapsed / mouthState.estimatedDuration);
    mouthState.lastProgress = expectedProgress;

    chatScroller.setProgress(expectedProgress);

    const attack = Math.min(1, elapsed / MOUTH_ATTACK_MS);
    const progress = Math.min(1, expectedProgress * mouthState.rateMult);

    const shape = shapeAtProgress(progress);
    shape.open *= attack;
    mouthState.lastRenderedShape = shape;
    renderMouth(shape, 1);
    mouthRAF = requestAnimationFrame(loop);
  }

  mouthStartDelayTimer = setTimeout(() => {
    mouthStartDelayTimer = null;
    if (!mouthState) return;
    mouthRAF = requestAnimationFrame(loop);
  }, AUDIO_ONSET_DELAY_MS);
}

function finishMouthAnimation() {
  // Cancel the onset-delay timer and any driving RAF.
  if (mouthStartDelayTimer) {
    clearTimeout(mouthStartDelayTimer);
    mouthStartDelayTimer = null;
  }
  if (mouthRAF) {
    cancelAnimationFrame(mouthRAF);
    mouthRAF = null;
  }

  // ★ Set the freeze flag so any RAF frame that slips through
  // between now and the first close step cannot redraw the
  // mouth in an intermediate viseme.
  mouthIsClosing = true;

  if (!mouthState) {
    renderMouth({ open: 0, width: 1, round: 0 }, 1);
    mouthIsClosing = false;
    return;
  }

  // Snapshot the exact shape currently on screen.
  const snapshot = mouthState.lastRenderedShape
    ? { ...mouthState.lastRenderedShape }
    : { open: 0, width: 1, round: 0 };

  // If the mouth is already effectively closed, just snap to
  // rest — a short fade from near-zero would look like a twitch.
  if (snapshot.open < 0.03) {
    renderMouth({ open: 0, width: 1, round: 0 }, 1);
    mouthState = null;
    mouthIsClosing = false;
    return;
  }

  const finalShape = { open: 0, width: 1, round: 0 };
  const startTime = performance.now();
  const startOpen  = snapshot.open;
  const startWidth = snapshot.width;
  const startRound = snapshot.round;

  function closeStep(now) {
    const t = Math.min(1, (now - startTime) / MOUTH_RELEASE_MS);
    // Cubic ease-out gives a natural "mouth relaxing to rest" curve.
    const ease = 1 - Math.pow(1 - t, 3);

    renderMouth({
      open:  startOpen  * (1 - ease),
      width: startWidth + (1 - startWidth) * ease,
      round: startRound * (1 - ease)
    }, 1);

    if (t < 1) {
      mouthRAF = requestAnimationFrame(closeStep);
    } else {
      renderMouth(finalShape, 1);
      mouthRAF = null;
      mouthState = null;
      mouthIsClosing = false;
    }
  }

  mouthRAF = requestAnimationFrame(closeStep);
}

/* =========================================================
   PENDING TRACKED MESSAGE
   ========================================================= */
let pendingTrackedMsgEl = null;

/* ---------- SPEECH ---------- */
function speak(text, onEnd) {
  if (!('speechSynthesis' in window)) {
    onEnd && onEnd();
    return;
  }

  stopIdleLoop();

  const u = new SpeechSynthesisUtterance(text);

  u.lang = 'en-US';
  const rate = 0.98;
  u.rate   = rate;
  u.pitch  = 1.2;
  u.volume = 1.0;

  if (!cachedVoice) refreshVoice();
  if (cachedVoice && isEnglishVoice(cachedVoice)) {
    u.voice = cachedVoice;
    u.lang  = cachedVoice.lang || 'en-US';
  } else {
    const voices = speechSynthesis.getVoices();
    const anyEnglish = voices.find(isEnglishVoice);
    if (anyEnglish) {
      u.voice = anyEnglish;
      u.lang  = anyEnglish.lang || 'en-US';
    }
  }

  u.onstart = () => {
    avatarBob.classList.add('talking');
    startExpressionLoop();

    if (pendingTrackedMsgEl) {
      chatScroller.trackMessageForSpeech(pendingTrackedMsgEl);
      pendingTrackedMsgEl = null;
    }

    startMouthAnimation(text, rate);
  };

  const finish = () => {
    avatarBob.classList.remove('talking');
    finishMouthAnimation();
    stopExpressionLoop();

    chatScroller.stopTracking();
    chatScroller.snapBottom();

    setTimeout(() => {
      onEnd && onEnd();
      startIdleLoop();
    }, 60);
  };

  u.onend   = finish;
  u.onerror = finish;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ---------- Send ---------- */
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('You', text, 'user');
  statusEl.textContent = 'Contacting Ivie AI... 🤔';
  showTypingIndicator();

  let reply;
  try {
    reply = await queryModel(text);
  } catch (err) {
    reply = '⚠️ ' + err.message;
  }
  hideTypingIndicator();

  conversation.push({ trigger: text, reply: reply });

  const botEl = addMsg('Ivie', reply, 'bot');
  pendingTrackedMsgEl = botEl;

  statusEl.textContent = 'Speaking... 🗣️';
  speak(reply, () => {
    statusEl.textContent = 'Ready to chat';
    sendBtn.disabled = false;
    input.focus();
  });
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

/* ---------- Export ---------- */
function downloadFile(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function getTimestamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
}

document.getElementById('exportJsonBtn').addEventListener('click', () => {
  if (conversation.length === 0) {
    statusEl.textContent = 'Nothing to export — start chatting!';
    setTimeout(() => statusEl.textContent = 'Ready to chat', 2000);
    return;
  }
  downloadFile(
    JSON.stringify(conversation, null, 2),
    `ivie_chat_${getTimestamp()}.json`,
    'application/json'
  );
});

document.getElementById('exportTxtBtn').addEventListener('click', () => {
  if (conversation.length === 0) {
    statusEl.textContent = 'Nothing to export — start chatting!';
    setTimeout(() => statusEl.textContent = 'Ready to chat', 2000);
    return;
  }
  let txt = `Ivie AI Chat Export — ${new Date().toLocaleString()}\n`;
  txt += `========================================\n\n`;
  for (const pair of conversation) {
    txt += `[You]\n${pair.trigger}\n\n`;
    txt += `[Ivie]\n${pair.reply}\n\n`;
  }
  downloadFile(txt, `ivie_chat_${getTimestamp()}.txt`, 'text/plain');
});

/* ---------- New Session ---------- */
document.getElementById('newSessionBtn').addEventListener('click', () => {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  avatarBob.classList.remove('talking');
  stopMouthAnimation();
  stopExpressionLoop();
  stopIdleLoop();
  chatScroller.stopTracking();
  pendingTrackedMsgEl = null;
  hideTypingIndicator();
  conversation = [];
  chatLog.innerHTML = '';
  input.value = '';
  sendBtn.disabled = false;
  statusEl.textContent = 'New session started ✨';
  setTimeout(() => {
    statusEl.textContent = 'Ready to chat';
    startIdleLoop();
  }, 1800);
  checkHealth();
  input.focus();
});

/* =========================================================
   BOOT: start the idle timer on page load
   ========================================================= */
window.addEventListener('load', () => {
  startIdleLoop();
});
</script>
